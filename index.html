const reduceMotion = () => window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
function useCountUp(value){
  const [v,setV]=useState(value);
  useEffect(()=>{ if(reduceMotion()){ setV(value); return; }
    let raf, start; const to=value||0, dur=700;
    const tick=t=>{ if(!start)start=t; const p=Math.min(1,(t-start)/dur);
      setV(to*(1-Math.pow(1-p,3))); if(p<1) raf=requestAnimationFrame(tick); };
    raf=requestAnimationFrame(tick); return ()=>cancelAnimationFrame(raf); },[value]);
  return v;
}

/* synchro GitHub (repo privé, données récupérables partout) */
const GH_KEY="snowball-gh";
function loadGh(){ try{return JSON.parse(localStorage.getItem(GH_KEY))||{path:"snowball-data.json"};}catch(e){return {path:"snowball-data.json"};} }
const b64enc=s=>btoa(unescape(encodeURIComponent(s)));
const b64dec=s=>decodeURIComponent(escape(atob((s||"").replace(/\n/g,""))));
async function ghGet(g){
  const r=await fetch(`https://api.github.com/repos/${g.owner}/${g.repo}/contents/${g.path}`,
    {headers:{Authorization:`Bearer ${g.token}`,Accept:"application/vnd.github+json"}});
  if(r.status===404) return {sha:null,content:null};
  if(!r.ok) throw new Error("lecture ("+r.status+")");
  const j=await r.json(); return {sha:j.sha, content:b64dec(j.content)};
}
async function ghPut(g,str,sha){
  const body={message:"Sauvegarde Snowball "+new Date().toISOString().slice(0,16).replace("T"," "), content:b64enc(str)};
  if(sha) body.sha=sha;
  const r=await fetch(`https://api.github.com/repos/${g.owner}/${g.repo}/contents/${g.path}`,
    {method:"PUT",headers:{Authorization:`Bearer ${g.token}`,Accept:"application/vnd.github+json","Content-Type":"application/json"},body:JSON.stringify(body)});
  if(!r.ok){ const t=await r.text(); throw new Error("écriture ("+r.status+") "+t.slice(0,80)); }
  return true;
}

function groupeOf(nom){const l=(nom||"").toLowerCase(); for(const g of GROUPES){ if(g.k.some(k=>l.includes(k))) return g.nom;} return "Autres";}
// Report d'un mois sur l'autre : on ne garde que le salaire dans les revenus (le reste, ponctuel, est remis a zero chaque mois).
function carryRev(revs){ const r=revs||[]; const sal=r.filter(x=>(x.nom||"").toLowerCase().includes("salaire")); return sal.length?sal:r.filter(x=>x.type==="actif"); }
// Cote depenses : on reporte les recurrentes (fixe + variable), pas les depenses ponctuelles (one-shot).
function carryDep(deps){ return (deps||[]).filter(x=>(x.cat||"variable")!=="ponctuelle"); }

/* projection multi-années partagée */
function projeter(net, apportAnnuel, rdt, objEUR, ans){
  const out=[]; let bal=net;
  for(let i=1;i<=ans;i++){ const debut=bal; const pv=debut*rdt; bal=debut+pv+apportAnnuel; out.push({i, net:bal}); }
  const hit=out.find(o=>o.net>=objEUR);
  return { points:out, hit: hit?hit.i:null };
}

function Donut({data,size=150}){
  const total=data.reduce((s,d)=>s+d.value,0);
  if(total<=0) return <div className="text-sm text-ink-400 py-10 text-center">Aucune donnée</div>;
  let acc=0; const stops=data.map(d=>{const a=acc/total*100;acc+=d.value;return `${d.color} ${a}% ${acc/total*100}%`;}).join(", ");
  const hole=Math.round(size*0.6);
  return (<div className="flex items-center gap-5 flex-wrap">
    <div className="rounded-full shrink-0 relative" style={{width:size,height:size,background:`conic-gradient(${stops})`}}>
      <div className="rounded-full bg-white absolute inset-0 m-auto flex flex-col items-center justify-center" style={{width:hole,height:hole}}>
        <span className="text-[10px] uppercase tracking-wide text-ink-400">Total</span>
        <span className="font-heading font-bold text-ink-900 text-sm">{fmtEk(total)}</span></div></div>
    <div className="space-y-1.5 text-sm flex-1 min-w-[160px]">
      {data.map((d,i)=>(<div key={i} className="flex items-center gap-2">
        <span className="w-2.5 h-2.5 rounded-full inline-block shrink-0" style={{background:d.color}}></span>
        <span className="text-ink-600 truncate">{d.label}</span>
        <span className="ml-auto font-semibold text-ink-900">{(d.value/total*100).toFixed(0)}%</span></div>))}
    </div></div>);
}
function LineChart({series, labels, height=240, fmt=fmtEk}){
  const W=680,H=height,padL=46,padB=26,padT=12,padR=14;
  const all=series.flatMap(s=>s.points.filter(p=>p!=null)); if(!all.length) return null;
  let max=Math.max(...all), min=Math.min(0,...all); if(max===min)max=min+1;
  const nx=labels.length>1?labels.length-1:1;
  const x=i=>padL+i*(W-padL-padR)/nx;
  const y=v=>H-padB-(v-min)/(max-min)*(H-padB-padT);
  const ticks=[0,.25,.5,.75,1].map(t=>min+(max-min)*t);
  const poly=pts=>pts.map((p,i)=>p==null?null:`${x(i)},${y(p)}`).filter(Boolean).join(" ");
  return (<svg viewBox={`0 0 ${W} ${H}`} className="w-full" style={{maxHeight:H}}>
    <defs>{series.map((s,si)=>(<linearGradient key={si} id={"g"+si} x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stopColor={s.color} stopOpacity="0.22"/><stop offset="100%" stopColor={s.color} stopOpacity="0"/></linearGradient>))}</defs>
    {ticks.map((t,i)=>(<g key={i}><line x1={padL} x2={W-padR} y1={y(t)} y2={y(t)} stroke="#eef2f7"/>
      <text x={6} y={y(t)+4} fontSize="10" fill="#94a3b8">{fmt(t)}</text></g>))}
    {labels.map((l,i)=> (labels.length<=13||i%Math.ceil(labels.length/8)===0) &&
      <text key={i} x={x(i)} y={H-padB+16} fontSize="10" fill="#94a3b8" textAnchor="middle">{l}</text>)}
    {series.map((s,si)=>{ if(!s.fill) return null; const idx=s.points.map((p,i)=>p==null?-1:i).filter(i=>i>=0); if(!idx.length) return null;
      return <polygon key={si} fill={`url(#g${si})`} points={`${x(idx[0])},${y(min)} `+poly(s.points)+` ${x(idx[idx.length-1])},${y(min)}`}/>;})}
    {series.map((s,si)=>(<polyline key={si} fill="none" stroke={s.color} strokeWidth="2.5" strokeDasharray={s.dash?"6 5":""} points={poly(s.points)}/>))}
    {series.map((s,si)=>s.points.map((p,i)=> p!=null && <circle key={si+"_"+i} cx={x(i)} cy={y(p)} r="3" fill="#fff" stroke={s.color} strokeWidth="2"/>))}
  </svg>);
}
function Sparkline({points,color=BLUE,w=110,h=34}){
  if(!points||points.length<2) return null;
  const max=Math.max(...points),min=Math.min(...points),d=max-min||1;
  const pts=points.map((p,i)=>`${i*(w/(points.length-1))},${h-((p-min)/d)*(h-4)-2}`).join(" ");
  return <svg width={w} height={h}><polyline fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" points={pts}/></svg>;
}
function MiniBars({items}){
  const max=Math.max(1,...items.map(i=>Math.abs(i.value)));
  return (<div className="space-y-3">{items.map((it,i)=>(<div key={i}>
    <div className="flex justify-between text-sm mb-1"><span className="text-ink-500">{it.label}</span>
      <span className="font-semibold" style={{color:it.color}}>{fmtE(it.value)}</span></div>
    <div className="h-2.5 rounded-full bg-ink-100 overflow-hidden"><div className="h-full rounded-full transition-all" style={{width:Math.min(100,Math.abs(it.value)/max*100)+"%",background:it.color}}/></div>
  </div>))}</div>);
}

/* Mention legale, reprise sur les exports PDF et la landing */
const DISCLAIMER="Snowball Finance est un outil de calcul et d'aide à la décision. Les analyses, recommandations et simulations sont générées automatiquement à partir de tes chiffres et fournies à titre informatif. Elles ne constituent pas un conseil en investissement, fiscal ou juridique au sens réglementaire. Vérifie tes calculs et consulte un professionnel (conseiller, expert-comptable, notaire) avant toute décision.";
/* insights */
function insights(c,data){
  const out=[]; const add=(tone,titre,txt)=>out.push({tone,titre,txt});
  const warns=[], infos=[], goods=[];
  const P=data&&data.params?data.params:{};
  const cibleFonds=n(P.cibleFondsMois)||6;
  const retraitFI=n(P.retraitFI)||0.04;
  const depT=n(c.depT), revT=n(c.revT), cashflow=n(c.cashflow);
  const dettes=(data&&Array.isArray(data.dettes))?data.dettes:[];
  const bourse=(data&&Array.isArray(data.bourse))?data.bourse:[];
  const patVide=(n(c.net)===0&&n(c.brut)===0&&n(c.dispo)===0), cfVide=(revT===0&&depT===0);
  if(patVide&&cfVide){ add("info","Commence par remplir ton patrimoine","Ajoute tes comptes, placements, biens et crédits pour que Snowball calcule ton disponible, ton cashflow et ton chemin vers l'indépendance financière."); return out; }
  if(cashflow<0) warns.push({tone:"warn",titre:"Cashflow négatif, priorité absolue",txt:"Tu dépenses "+fmtE(Math.abs(cashflow))+" de plus que tu ne gagnes chaque mois, soit "+fmtE(Math.abs(cashflow)*12)+" par an. Coupe d'abord les dépenses variables (abonnements, sorties, achats) avant tout projet d'épargne."});
  if(depT>0&&n(c.fondsMois)<cibleFonds) warns.push({tone:"warn",titre:"Fonds d'urgence à constituer",txt:"Tu couvres "+fmtM(n(c.fondsMois))+" de dépenses, vise "+fmtM(cibleFonds)+" soit "+fmtE(cibleFonds*depT)+" de liquidités (3 à 6 mois idéalement). C'est la priorité avant d'investir."});
  let pire=null; for(const d of dettes){ if(d&&d.type==="credit"&&!d.bienLie&&n(d.taux)>=0.05){ if(!pire||n(d.taux)>n(pire.taux)) pire=d; } }
  if(pire) warns.push({tone:"warn",titre:"Attaque ta dette la plus chère",txt:"Le crédit "+(pire.nom||"conso")+" coûte "+fmtP(n(pire.taux))+" par an sur "+fmtE(n(pire.montant))+". Le rembourser en priorité (méthode avalanche) te rapporte un rendement garanti de "+fmtP(n(pire.taux))+", bien plus sûr qu'un placement. Un crédit immo à taux bas, lui, garde son effet de levier."});
  if(revT>0){ const te=n(c.tauxEpargne), annu=fmtE(cashflow*12);
    if(te<0.10&&cashflow>=0) warns.push({tone:"warn",titre:"Taux d'épargne très faible",txt:"Tu épargnes "+fmtP(te)+" de tes revenus ("+annu+" par an). Vise au moins 20% : chaque point gagné rapproche ta date d'indépendance financière."});
    else if(te>=0.10&&te<0.20) infos.push({tone:"info",titre:"Pousse ton épargne vers 20%",txt:"Tu épargnes "+fmtP(te)+" ("+annu+" par an), juste sous le seuil sain de 20%. Plus tu montes ce taux, plus tôt tu atteins la liberté financière."});
    else if(te>=0.20&&te<0.50) goods.push({tone:"good",titre:"Bon taux d'épargne",txt:"Tu épargnes "+fmtP(te)+" de tes revenus, soit "+annu+" par an. Tu es au-dessus du seuil sain de 20%, continue ainsi."});
    else if(te>=0.50) goods.push({tone:"good",titre:"Taux d'épargne exceptionnel",txt:"Tu épargnes "+fmtP(te)+" ("+annu+" par an), un rythme digne du mouvement FIRE qui peut t'amener à l'indépendance en quelques années."});
  }
  if(n(c.ratioFI)>=1) goods.push({tone:"good",titre:"Indépendance financière atteinte",txt:"Tes revenus passifs ("+fmtE(n(c.revP))+" par mois) couvrent l'intégralité de ton train de vie. Tu es financièrement libre, tes choix ne dépendent plus de ton salaire."});
  else if(depT>0) infos.push({tone:"info",titre:"Bâtis tes revenus passifs",txt:"Tes revenus passifs couvrent "+fmtP(n(c.ratioFI))+" de ton train de vie. Pour viser l'indépendance (retrait à "+fmtP(retraitFI)+"), il te faut environ "+fmtE(n(c.capitalFI))+" de capital, à nourrir via dividendes et locatif."});
  if(n(c.objEUR)>0){ const po=n(c.pctObjDispo);
    if(po>=1) goods.push({tone:"good",titre:"Objectif de disponible atteint",txt:"Ton disponible ("+fmtE(n(c.dispo))+") dépasse ton objectif de "+fmtE(n(c.objEUR))+". Félicitations, tu peux relever la barre ou sécuriser ce capital."});
    else if(po>=0.9) goods.push({tone:"good",titre:"Objectif de disponible presque atteint",txt:"Tu es à "+fmtP(po)+" de ton objectif, il ne te manque que "+fmtE(n(c.resteDispo))+" de disponible. La ligne d'arrivée est proche."});
  }
  if(depT>0&&n(c.fondsMois)>=cibleFonds&&n(c.fondsMois)>cibleFonds+3){ const surplus=n(c.cash)-cibleFonds*depT;
    if(surplus>0) infos.push({tone:"info",titre:"Trop de cash qui dort",txt:"Au-delà de ton fonds d'urgence, "+fmtE(surplus)+" dorment et perdent de la valeur avec l'inflation. Investis cet excédent pour lancer l'effet boule de neige des intérêts composés."}); }
  if(cashflow>0&&depT>0&&n(c.fondsMois)>=cibleFonds&&n(c.bourseValeur)<n(c.cash)) infos.push({tone:"info",titre:"Automatise ton investissement",txt:"Ton fonds d'urgence est prêt et il te reste "+fmtE(cashflow)+" par mois. Mets en place un virement automatique vers un ETF monde (DCA) pour investir sans y penser."});
  if(n(c.brut)>0&&n(c.immoValeur)/n(c.brut)>0.70) infos.push({tone:"info",titre:"Patrimoine concentré sur l'immobilier",txt:"L'immobilier pèse "+fmtP(n(c.immoValeur)/n(c.brut))+" de ton patrimoine brut. Diversifier vers la bourse (ETF monde) réduit ton risque et améliore ta liquidité."});
  let totBourse=0; for(const b of bourse){ totBourse+=n(b.valeur); }
  if(totBourse>0){ let topB=null; for(const b of bourse){ if(!topB||n(b.valeur)>n(topB.valeur)) topB=b; }
    if(topB&&n(topB.valeur)/totBourse>0.5) infos.push({tone:"info",titre:"Ligne bourse trop dominante",txt:(topB.nom||"Une ligne")+" représente "+fmtP(n(topB.valeur)/totBourse)+" de ton portefeuille. Concentrer autant sur un seul actif est risqué, équilibre vers un fonds diversifié."}); }
  if(n(c.pvLatente)>0&&n(c.brut)>0&&n(c.pvLatente)>0.05*n(c.brut)) infos.push({tone:"info",titre:"Plus-value latente non réalisée",txt:"Tu portes "+fmtE(n(c.pvLatente))+" de plus-value latente, un gain encore sur le papier tant que tu ne vends pas. Compte avec son éventuelle fiscalité avant de la considérer acquise."});
  const all=warns.concat(infos).concat(goods).slice(0,6);
  for(const it of all) add(it.tone,it.titre,it.txt);
  if(out.length===0) add("info","Continue à enrichir ton suivi","Aucune alerte majeure pour l'instant. Complète tes données et fixe un objectif de disponible pour des recommandations plus précises.");
  return out;
}

/* Guide de démarrage */
function GuideDemarrage({data,setData,ghReady,go,openAssistant,loadDemo,hasData}){
  const mc=data.mois[data.moisActif]||{revenus:[],depenses:[]};
  const ess=[
    {fait:(data.patrimoine||[]).some(a=>n(a.montant)>0), label:"Renseigne ton patrimoine", hint:"Comptes, placements, liquidités", tab:"patrimoine"},
    {fait:(mc.revenus||[]).some(r=>n(r.montant)>0), label:"Saisis tes revenus du mois", hint:"Salaire, revenus passifs", tab:"cashflow"},
    {fait:(mc.depenses||[]).some(p=>n(p.montant)>0), label:"Saisis tes dépenses du mois", hint:"Loyer, courses, factures", tab:"cashflow"},
    {fait:n(data.params.objectifEUR)>0, label:"Fixe ton objectif", hint:"Le patrimoine net visé (Réglages)", tab:"reglages"},
    {fait:!!ghReady, label:"Active la sauvegarde GitHub", hint:"Pour ne jamais perdre tes données", tab:"reglages"},
  ];
  const opt=[
    {key:"credits",fait:(data.dettes||[]).length>0, label:"Renseigne tes crédits", hint:"Mensualité et capital restant (Cashflow)", tab:"cashflow"},
    {key:"immo",fait:(data.biens||[]).length>0, label:"Ajoute tes biens immobiliers", hint:"Patrimoine, sous-onglet Immobilier", tab:"patrimoine"},
    {key:"bourse",fait:(data.bourse||[]).length>0, label:"Ajoute tes investissements", hint:"Bourse, PE, crypto, PER (Patrimoine > Investissements)", tab:"patrimoine"},
    {key:"histo",fait:(data.suivi||[]).some(r=>n(r.brut)>0), label:"Renseigne ton historique", hint:"Tes années passées (Suivi)", tab:"suivi"},
    {key:"objectifs",fait:(data.jalons||[]).some(j=>j.statut==="Fait"||j.statut==="En cours"), label:"Fixe-toi des objectifs", hint:"Tes objectifs de progression", tab:"objectifs"},
  ];
  const skip=data.guideSkip||{};
  const setSkip=(k,v)=>setData(d=>{const g={...(d.guideSkip||{})}; if(v)g[k]=true; else delete g[k]; return {...d,guideSkip:g};});
  const done=ess.filter(s=>s.fait).length, total=ess.length;
  const [open,setOpen]=useState(done<total);
  const Row=({s})=>{const skipped=s.key&&skip[s.key], fini=s.fait||skipped;

      <span className="flex-1 min-w-0"><span className={"text-sm font-medium "+(fini?"text-ink-400 line-through":"text-ink-900")}>{s.label}</span><span className="block text-xs text-ink-400">{skipped?"Non concerné":s.hint}</span></span>
      {!fini&&<button onClick={()=>go(s.tab)} className="text-xs text-brand-700 font-medium shrink-0 hover:underline cursor-pointer">Aller</button>}
      {!fini&&s.key&&<button onClick={()=>setSkip(s.key,true)} className="text-xs text-ink-400 shrink-0 hover:text-ink-700 cursor-pointer whitespace-nowrap">Je n'ai pas</button>}
      {skipped&&<button onClick={()=>setSkip(s.key,false)} className="text-xs text-ink-400 shrink-0 hover:text-ink-700 cursor-pointer">Annuler</button>}
    </div>);};
  if(done>=total) return null; // une fois l'essentiel rempli, le bloc s'efface pour laisser la place a la mise a jour mensuelle
  return (<div className="card panel rounded-3xl overflow-hidden">
    <div className="p-5 sm:p-6 text-white relative overflow-hidden" style={{background:"linear-gradient(135deg,#38bdf8,#0369a1)"}}>

      </div>}
    </div>
  </div>);
}

/* Suivi mensuel récurrent */

  const toggle=k=>setData(d=>{const ro={...(d.routine||{})}; const cur={...(ro[ym]||{})}; cur[k]=!cur[k]; ro[ym]=cur; return {...d,routine:ro};});
  const savedThisMonth=(ghMaj||"").slice(0,7)===ym;

  ];
  const done=items.filter(i=>i.fait).length, total=items.length;
  const [open,setOpen]=useState(done<total);
  return (<div className="card panel rounded-3xl p-5 sm:p-6">
    <div className="flex items-center justify-between gap-3 cursor-pointer" onClick={()=>setOpen(!open)}>

        <div><h3 className="font-heading font-semibold text-ink-900">Mise à jour de {moisLong(ym)}</h3>
        <p className="text-xs text-ink-500 mt-0.5">{done===total?"Tout est à jour pour ce mois. Reviens le mois prochain.":"Ce qu'il reste à actualiser ce mois ("+done+"/"+total+")."}</p></div></div>
      <div className="flex items-center gap-3"><div className="w-24 h-2 rounded-full bg-ink-100 overflow-hidden hidden sm:block"><div className="h-full bg-gradient-to-r from-brand-400 to-brand-600 transition-all" style={{width:(done/total*100)+"%"}}/></div><span className="text-ink-400">{open?"▾":"▸"}</span></div>
    </div>
    {open&&<div className="mt-3 space-y-1">{items.map(it=>(<div key={it.k} className="flex items-center gap-3 rounded-xl p-2.5 hover:bg-ink-100 transition">
      <button onClick={()=>!it.auto&&toggle(it.k)} disabled={it.auto} className={"w-6 h-6 rounded-lg flex items-center justify-center shrink-0 transition "+(it.fait?"bg-brand-500 text-white":"border-2 border-ink-200 text-transparent hover:border-brand-400")+(it.auto?"":" cursor-pointer")}><Icon name="check" className="w-4 h-4" stroke={3}/></button>
      <span className={"flex-1 text-sm font-medium "+(it.fait?"text-ink-400 line-through":"text-ink-900")}>{it.label}{it.auto&&it.fait?" (fait)":""}</span>
      <button onClick={()=>go(it.tab)} className="text-xs text-brand-700 font-medium hover:underline cursor-pointer shrink-0">Aller</button></div>))}
      <p className="text-xs text-ink-400 px-2.5 pt-1">Coche au fur et à mesure. Le mois prochain, cette liste se réinitialise automatiquement.</p></div>}
  </div>);
}

/* Tableau de bord */

  const delAct=id=>setData(d=>({...d,actionsPerso:(d.actionsPerso||[]).filter(a=>a.id!==id)}));

    <div className="grid lg:grid-cols-3 gap-4">

        <KPI label="Fonds d'urgence" value={fmtM(c.fondsMois)} sub={"Réserve de cash, cible "+data.params.cibleFondsMois+" mois"} icon="bank" tone={c.fondsMois<data.params.cibleFondsMois?"amber":"blue"}/>
      </div>
    </div>
    <div className="grid lg:grid-cols-2 gap-5 items-start">
      <Card title="Recommandations" sub="Générées automatiquement à partir de tes chiffres">
        <div className="space-y-3">{reco.map((r,i)=>{const s=toneStyle[r.tone];return(
          <div key={i} className={"rounded-2xl border p-4 flex gap-3 "+s.b}><span className={"w-2 h-2 rounded-full mt-2 shrink-0 "+s.d}/>
            <div><div className={"font-heading font-semibold text-sm "+s.t}>{r.titre}</div>
              <div className="text-sm text-ink-600 mt-0.5">{r.txt}</div></div></div>);})}</div>
        <p className="text-[11px] leading-snug text-ink-400 mt-3 pt-3 border-t border-ink-100">{DISCLAIMER}</p>
      </Card>
      <Card title="Mon plan d'action" sub="Tes propres actions à mettre en place" right={<AddBtn onClick={addAct}>Ajouter</AddBtn>}>
        {acts.length===0&&<div className="text-sm text-ink-400 py-6 text-center">Ajoute tes actions personnelles à suivre ici.</div>}
        <div className="space-y-2">{acts.map(a=>(<div key={a.id} className="flex items-center gap-2">
          <button onClick={()=>updAct(a.id,{fait:!a.fait})} className={"w-6 h-6 shrink-0 rounded-lg border flex items-center justify-center cursor-pointer transition "+(a.fait?"bg-brand-500 border-brand-500 text-white":"border-ink-200 bg-white text-transparent hover:border-brand-400")}><Icon name="check" className="w-4 h-4" stroke={3}/></button>
          <input className={"flex-1 px-3 py-2 rounded-xl border border-ink-200 bg-white outline-none focus:border-brand-400 focus:ring-2 focus:ring-brand-100 "+(a.fait?"line-through text-ink-400":"text-ink-900")}
            value={a.texte} placeholder="Mon action…" onChange={e=>updAct(a.id,{texte:e.target.value})}/>
          <IconBtn name="x" onClick={()=>delAct(a.id)} title="Supprimer"/></div>))}</div>
      </Card>
    </div>
    <div className="grid md:grid-cols-2 gap-5">
      <Card title="Allocation du patrimoine" sub="Répartition par classe d'actifs"><Donut data={alloc}/></Card>
      <Card title="Cashflow du mois" right={<button onClick={()=>go("cashflow")} className="text-xs text-brand-700 hover:underline cursor-pointer">Détailler</button>}>
        <MiniBars items={[{label:"Revenus",value:c.revT,color:BLUE},{label:"Dépenses",value:c.depT,color:"#ef4444"},{label:"Cashflow net",value:c.cashflow,color:"#0ea5e9"}]}/>
        {spark.length>1&&<div className="mt-4 flex items-center gap-3 text-xs text-ink-500"><span>Tendance</span><Sparkline points={spark}/></div>}
        <div className="grid grid-cols-2 gap-3 mt-4"><Mini label="Revenu actif" v={fmtE(c.revA)}/><Mini label="Revenu passif" v={fmtE(c.revP)}/></div>
      </Card>
    </div>
    <div className="grid md:grid-cols-2 gap-5">
      <Card title="Disponible dans le temps" sub="Un instantané est enregistré chaque mois">
        {snaps.length>1? <LineChart labels={snaps.map(moisCourt)} series={[{name:"Net",color:BLUE,points:netSeries,fill:true}]} height={200}/> : <div className="text-sm text-ink-400 py-10 text-center">La courbe se construit au fil des mois d'utilisation.</div>}
      </Card>
      <Card title="Cashflow mensuel" sub="Alimenté par tes saisies de l'onglet Cashflow">
        {hist.length>1? <LineChart labels={hist.map(h=>moisCourt(h.ym))} series={[{name:"Cashflow",color:"#0ea5e9",points:hist.map(h=>h.cf),fill:true}]} height={200}/> : <div className="text-sm text-ink-400 py-10 text-center">Saisis plusieurs mois pour voir la tendance.</div>}
      </Card>
    </div>
  </div>);
}

/* Patrimoine */
function AssistantGuide({data,setData,onClose,go}){
  const [e,setE]=useState(0);
  const addAsset=(nom,classe)=>setData(d=>({...d,patrimoine:[...d.patrimoine,{id:uid(),nom,etablissement:"",pays:"",montant:0,prixRevient:0,classe}]}));
  const updA=(id,p)=>setData(d=>({...d,patrimoine:d.patrimoine.map(a=>a.id===id?{...a,...p}:a)}));
  const delA=id=>setData(d=>({...d,patrimoine:d.patrimoine.filter(a=>a.id!==id)}));
  const addUsage=u=>setData(d=>({...d,biens:[...(d.biens||[]),{id:uid(),usage:u,nom:u==="MDB"?"Opération":"Bien",prixAchat:0,fraisNotaire:0,fraisAgence:0,fraisCredit:0,travaux:0,valeur:0,loyer:0,charges:0,taxe:0,vacance:0,capital:0,mensualite:0,taux:0.03,prixRevente:0,portageMois:0,dureeMois:6,fraisRevente:0,tauxIS:0.25}]}));
  const updB=(id,p)=>setData(d=>({...d,biens:(d.biens||[]).map(b=>b.id===id?{...b,...p}:b)}));
  const delB=id=>setData(d=>({...d,biens:(d.biens||[]).filter(b=>b.id!==id)}));
  const addBo=(nom,type)=>setData(d=>({...d,bourse:[...(d.bourse||[]),{id:uid(),nom,type,investi:0,valeur:0,dividendes:0}]}));
  const updBo=(id,p)=>setData(d=>({...d,bourse:(d.bourse||[]).map(x=>x.id===id?{...x,...p}:x)}));
  const delBo=id=>setData(d=>({...d,bourse:(d.bourse||[]).filter(x=>x.id!==id)}));
  const addCr=(type)=>setData(d=>({...d,dettes:[...d.dettes,{id:uid(),nom:"",type:type||"credit",montant:0,mensualite:0,taux:0.03,actifLie:"",bienLie:""}]}));
  const updCr=(id,p)=>setData(d=>({...d,dettes:d.dettes.map(x=>x.id===id?{...x,...p}:x)}));
  const delCr=id=>setData(d=>({...d,dettes:d.dettes.filter(x=>x.id!==id)}));
  const setP=(k,v)=>setData(d=>({...d,params:{...d.params,[k]:v}}));
  const ym=data.moisActif; const mc=data.mois[ym]||{revenus:[],depenses:[]};
  const setMc=(kind,lines)=>setData(d=>({...d,mois:{...d.mois,[ym]:{...(d.mois[ym]||{revenus:[],depenses:[]}),[kind]:lines}}}));
  const addRev=(nom,type)=>setMc("revenus",[...mc.revenus,{id:uid(),nom,montant:0,type:type||"passif"}]);
  const updRev=(id,p)=>setMc("revenus",mc.revenus.map(x=>x.id===id?{...x,...p}:x));
  const delRev=id=>setMc("revenus",mc.revenus.filter(x=>x.id!==id));
  const addDep=(nom,cat)=>setMc("depenses",[...mc.depenses,{id:uid(),nom,montant:0,cat:cat||"variable"}]);
  const updDep=(id,p)=>setMc("depenses",mc.depenses.map(x=>x.id===id?{...x,...p}:x));
  const delDep=id=>setMc("depenses",mc.depenses.filter(x=>x.id!==id));
  const dejaR=new Set(mc.revenus.map(x=>(x.nom||"").toLowerCase())), dejaD=new Set(mc.depenses.map(x=>(x.nom||"").toLowerCase()));
  const biens=data.biens||[], bourse=data.bourse||[];
  const immoListW=biens.filter(b=>b.usage==="RP"||b.usage==="Locatif");
  const brut=sum(data.patrimoine,a=>a.montant)+sum(biens.filter(b=>b.usage!=="MDB"),b=>b.valeur)+sum(bourse,x=>x.valeur);
  const dettesT=sum(data.dettes,x=>x.montant)+sum(biens.filter(b=>b.usage!=="MDB"),b=>b.capital);
  const net=brut-dettesT;
  const pvLat=sum(data.patrimoine.filter(a=>n(a.prixRevient)>0&&a.classe!=="Liquidités"),a=>n(a.montant)-n(a.prixRevient))
    +sum(biens.filter(b=>b.usage!=="MDB"&&coutRevient(b)>0),b=>n(b.valeur)-coutRevient(b))
    +sum(bourse.filter(x=>n(x.investi)>0),x=>n(x.valeur)-n(x.investi));
  const reSurW=sum(biens.filter(b=>b.usage!=="MDB"),b=>coutRevient(b)-n(b.capital))+sum(data.patrimoine.filter(a=>a.classe==="Immobilier"),a=>n(a.prixRevient)>0?n(a.prixRevient):n(a.montant));
  const dispoW=net-pvLat-reSurW;
  const titres=["Bienvenue","Comptes & liquidités","Immobilier","Investissements","Crédits","Revenus du mois","Dépenses récurrentes","Objectif"];
  const dejaP=new Set(data.patrimoine.map(a=>(a.nom||"").toLowerCase())), dejaB=new Set(bourse.map(x=>(x.nom||"").toLowerCase()));
  return (<div className="fixed inset-0 z-50 bg-ink-900/40 flex items-start sm:items-center justify-center p-3 overflow-y-auto" style={{backdropFilter:"blur(4px)"}}>
    <div className="panel rounded-3xl w-full max-w-2xl my-6 p-5 sm:p-6">
      <div className="flex items-center justify-between mb-3"><h3 className="font-heading font-bold text-lg text-ink-900">Assistant guidé</h3>
        <button onClick={onClose} className="text-ink-400 hover:text-ink-700 cursor-pointer"><Icon name="x" className="w-5 h-5"/></button></div>
      <div className="flex gap-1 mb-4">{titres.map((t,i)=><div key={i} className={"h-1.5 flex-1 rounded-full "+(i<=e?"bg-brand-500":"bg-ink-100")}/>)}</div>
      <div className="min-h-[230px]">
        <div className="text-xs uppercase tracking-wide text-ink-400">Étape {e+1} / {titres.length}</div>
        <h4 className="font-heading font-semibold text-ink-900 text-lg mb-3">{titres[e]}</h4>
        {e===0&&<div className="text-sm text-ink-600 space-y-2"><p>Je vais t'aider à tout renseigner, étape par étape : tes comptes, ton immobilier, ta bourse, tes crédits, puis ton objectif.</p><p>À chaque étape, clique sur ce que tu possèdes et indique le montant. Passe une étape si elle ne te concerne pas.</p></div>}
        {e===1&&<div className="space-y-3"><Chips options={SUGG_PATRI.map(([label,classe])=>({label,has:dejaP.has(label.toLowerCase()),add:()=>addAsset(label,classe)}))}/>
          <div className="space-y-2">{data.patrimoine.map(a=>(<div key={a.id} className="flex items-center gap-2"><div className="flex-1"><TextInput value={a.nom} onChange={v=>updA(a.id,{nom:v})} placeholder="Nom du compte"/></div><Money value={a.montant} onChange={v=>updA(a.id,{montant:v})} className="w-32"/><IconBtn name="x" onClick={()=>delA(a.id)}/></div>))}</div></div>}
        {e===2&&<div className="space-y-3"><Chips options={[{label:"Résidence principale",add:()=>addUsage("RP")},{label:"Bien locatif",add:()=>addUsage("Locatif")},{label:"Achat / revente",add:()=>addUsage("MDB")}]}/>
          <div className="space-y-3">{biens.map(b=>(
            <div key={b.id} className="rounded-2xl border border-ink-100 p-3 space-y-3">
              <div className="flex items-center gap-2">
                <div className="flex-1"><TextInput value={b.nom} onChange={v=>updB(b.id,{nom:v})} placeholder="Nom du bien"/></div>
                <select value={b.usage} onChange={ev=>updB(b.id,{usage:ev.target.value})} className="text-sm rounded-xl border border-ink-200 py-2 px-2 text-ink-600 bg-white">{IMMO_MODES.map(([k,l])=><option key={k} value={k}>{l}</option>)}</select>
                <IconBtn name="x" onClick={()=>delB(b.id)}/>
              </div>
              <Acquisition b={b} upd={updB}/>
              <div className="grid sm:grid-cols-2 gap-3"><ValeurEstimee b={b} upd={updB}/></div>
              <CreditBien b={b} upd={updB}/>
            </div>))}</div>
          {biens.length===0&&<p className="text-sm text-ink-400">Ajoute un bien ci-dessus (résidence principale, locatif ou achat-revente).</p>}
          <p className="text-xs text-ink-400">Renseigne le prix d'achat, les frais (notaire, agence), les travaux, la valeur estimée et le crédit. Les loyers, le rendement et la fiscalité se détaillent ensuite dans Patrimoine, sous-onglet Immobilier.</p></div>}
        {e===3&&<div className="space-y-3"><Chips options={SUGG_BOURSE.map(([label,type])=>({label,has:dejaB.has(label.toLowerCase()),add:()=>addBo(label,type)}))}/>
          <div className="space-y-2">{bourse.map(x=>(<div key={x.id} className="flex items-center gap-2"><div className="flex-1"><TextInput value={x.nom} onChange={v=>updBo(x.id,{nom:v})} placeholder="Nom de la ligne"/></div><Money value={x.valeur} onChange={v=>updBo(x.id,{valeur:v})} className="w-32"/><IconBtn name="x" onClick={()=>delBo(x.id)}/></div>))}</div></div>}
        {e===4&&<div className="space-y-3"><div className="text-sm text-ink-500"><b>Crédit</b> = un emprunt avec mensualité. <b>Dette</b> = de l'argent que tu dois (ex : un apport prêté par un proche). Rattachée à un bien, une dette réduit sa plus-value latente, pas ton disponible.</div>
          <div className="flex gap-2 flex-wrap">
            <button onClick={()=>addCr("credit")} className="inline-flex items-center gap-1.5 text-sm text-white bg-brand-600 hover:bg-brand-700 font-medium px-3 py-1.5 rounded-xl cursor-pointer"><Icon name="plus" className="w-4 h-4"/>Ajouter un crédit</button>
            <button onClick={()=>addCr("dette")} className="inline-flex items-center gap-1.5 text-sm text-brand-700 border border-brand-300 hover:bg-brand-50 font-medium px-3 py-1.5 rounded-xl cursor-pointer"><Icon name="plus" className="w-4 h-4"/>Ajouter une dette</button>
          </div>
          <div className="space-y-2">{data.dettes.map(x=>{const t=x.type||"credit"; return(<div key={x.id} className="flex flex-wrap items-center gap-2">
            <select value={t} onChange={ev=>updCr(x.id,{type:ev.target.value})} className="text-sm rounded-xl border border-ink-200 py-2 px-2 text-ink-600 bg-white"><option value="credit">Crédit</option><option value="dette">Dette</option></select>
            <div className="flex-1 min-w-[120px]"><TextInput value={x.nom} onChange={v=>updCr(x.id,{nom:v})} placeholder={t==="dette"?"Ex : prêt de Paul":"Ex : crédit auto"}/></div>
            {t==="credit"&&<Money value={x.mensualite} onChange={v=>updCr(x.id,{mensualite:v})} suffix="/m" className="w-24"/>}
            <Money value={x.montant} onChange={v=>updCr(x.id,{montant:v})} className="w-28"/>
            {immoListW.length>0&&<select value={x.bienLie||""} onChange={ev=>updCr(x.id,{bienLie:ev.target.value})} className="text-xs rounded-lg border border-ink-200 py-2 px-1.5 text-ink-600 bg-white" title="Rattacher à un bien immobilier"><option value="">Lié à un bien...</option>{immoListW.map(b=><option key={b.id} value={b.id}>{b.nom}</option>)}</select>}
            <IconBtn name="x" onClick={()=>delCr(x.id)}/></div>);})}</div>
          {data.dettes.length===0&&<p className="text-sm text-ink-400">Aucune dette ni crédit pour l'instant.</p>}</div>}
        {e===5&&<div className="space-y-3"><div className="text-sm text-ink-500">Tes revenus de {moisLong(ym)}. À renseigner de préférence en fin de mois, une fois le salaire reçu.</div><Chips options={SUGG_REV.map(([label,type])=>({label,has:dejaR.has(label.toLowerCase()),add:()=>addRev(label,type)}))}/>
          <div className="space-y-2">{mc.revenus.map(x=>(<div key={x.id} className="flex items-center gap-2"><div className="flex-1"><TextInput value={x.nom} onChange={v=>updRev(x.id,{nom:v})} placeholder="Revenu"/></div><select value={x.type} onChange={ev=>updRev(x.id,{type:ev.target.value})} className="text-xs rounded-lg border border-ink-200 py-2 px-1.5 text-ink-600 bg-white"><option value="actif">actif</option><option value="passif">passif</option></select><Money value={x.montant} onChange={v=>updRev(x.id,{montant:v})} className="w-28"/><IconBtn name="x" onClick={()=>delRev(x.id)}/></div>))}</div>
          <button onClick={()=>go&&go("cashflow")} className="inline-flex items-center gap-1.5 text-sm font-medium text-brand-700 hover:text-brand-800 hover:bg-brand-50 px-3 py-2 rounded-xl transition cursor-pointer">Gérer mes revenus en détail dans le Cashflow <Icon name="trending" className="w-4 h-4"/></button></div>}
        {e===6&&<div className="space-y-3"><div className="text-sm text-ink-500">Ajoute vite tes dépenses récurrentes. Pour les classer fixe / variable, voir leur poids dans tes revenus et le détail, gère-les dans le Cashflow.</div><Chips options={SUGG_DEP.map(([label,cat])=>({label,has:dejaD.has(label.toLowerCase()),add:()=>addDep(label,cat)}))}/>
          <div className="space-y-2">{mc.depenses.map(x=>(<div key={x.id} className="flex items-center gap-2"><div className="flex-1"><TextInput value={x.nom} onChange={v=>updDep(x.id,{nom:v})} placeholder="Dépense"/></div><Money value={x.montant} onChange={v=>updDep(x.id,{montant:v})} className="w-28"/><IconBtn name="x" onClick={()=>delDep(x.id)}/></div>))}</div>
          <button onClick={()=>go&&go("cashflow")} className="inline-flex items-center gap-1.5 text-sm font-medium text-brand-700 hover:text-brand-800 hover:bg-brand-50 px-3 py-2 rounded-xl transition cursor-pointer">Gérer mes dépenses en détail (fixe / variable, %) dans le Cashflow <Icon name="trending" className="w-4 h-4"/></button></div>}
        {e===7&&<div className="space-y-3"><Field label="Mon objectif de patrimoine net (en €)"><Money value={data.params.objectifEUR} onChange={v=>setP("objectifEUR",v)}/></Field>
          <div className="rounded-2xl bg-brand-50 border border-brand-200 p-4 text-sm text-ink-700">C'est tout bon. Ton disponible est de <b className="text-brand-700">{fmtE(dispoW)}</b>{pvLat!==0&&<>, plus <b className={pvLat>=0?"text-brand-600":"text-red-500"}>{pvLat>=0?"+":""}{fmtE(pvLat)}</b> de plus-value latente</>}. Pense à activer la sauvegarde GitHub dans Réglages pour ne rien perdre.</div></div>}
      </div>
      <div className="flex items-center justify-between mt-4 pt-4 border-t border-ink-100">
        <div className="text-sm text-ink-500">Disponible : <b className="text-brand-700">{fmtE(dispoW)}</b>{pvLat!==0&&<span className="hidden sm:inline"> · PV latente <b className={pvLat>=0?"text-brand-600":"text-red-500"}>{pvLat>=0?"+":""}{fmtE(pvLat)}</b></span>}</div>
        <div className="flex gap-2">{e>0&&<button onClick={()=>setE(e-1)} className="px-4 py-2 rounded-xl border border-ink-200 text-ink-700 hover:bg-ink-100 text-sm cursor-pointer">Précédent</button>}
          {e<titres.length-1?<button onClick={()=>setE(e+1)} className="px-4 py-2 rounded-xl bg-brand-600 hover:bg-brand-700 text-white text-sm font-medium cursor-pointer">Suivant</button>
            :<button onClick={onClose} className="px-4 py-2 rounded-xl bg-brand-600 hover:bg-brand-700 text-white text-sm font-medium cursor-pointer">Terminer</button>}</div>
      </div>
    </div></div>);
}

function AssistantBanner({onStart}){

    <div className="absolute -right-6 -bottom-10 opacity-15"><Snowflake className="w-40 h-40"/></div>
    <div className="flex flex-wrap items-center gap-4 justify-between relative">
      <div className="min-w-[220px]"><h3 className="font-heading text-xl font-bold flex items-center gap-2"><Icon name="check" className="w-5 h-5"/>Assistant guidé</h3>

      <KPI label="Plus-value latente" value={fmtE(c.pvLatente)} tone={c.pvLatente>=0?"blue":"red"}/></div>

      <div className="grid grid-cols-3 gap-3">
        <div><div className="text-xs text-ink-500">Immobilier</div><div className={"font-heading font-bold "+(c.pvImmo>=0?"text-brand-700":"text-red-500")}>{fmtE(c.pvImmo)}</div><div className="text-[11px] text-ink-400">valeur estimée − coût de revient</div></div>
        <div><div className="text-xs text-ink-500">Investissements</div><div className={"font-heading font-bold "+(c.pvBourse>=0?"text-brand-700":"text-red-500")}>{fmtE(c.pvBourse)}</div><div className="text-[11px] text-ink-400">valeur − montant investi</div></div>
        <div><div className="text-xs text-ink-500">Comptes</div><div className={"font-heading font-bold "+(c.pvFin>=0?"text-brand-700":"text-red-500")}>{fmtE(c.pvFin)}</div><div className="text-[11px] text-ink-400">montant − montant investi</div></div>
      </div>
      <p className="text-xs text-ink-400 mt-2">Le détail ligne par ligne est dans chaque sous-onglet (Immobilier, Investissements, Comptes). Une ligne ne compte que si tu as renseigné la valeur ET le coût d'achat.</p>
    </div>}
    <Card title="Allocation"><Donut data={alloc}/></Card>
    <Conseils items={tips}/>
    <div className="panel rounded-2xl p-1.5 flex gap-1 w-fit">{SUBS.map(([k,l])=><button key={k} onClick={()=>setSub(k)} className={"px-4 py-2 rounded-xl text-sm font-medium cursor-pointer transition "+(sub===k?"bg-gradient-to-br from-brand-500 to-brand-700 text-white shadow":"text-ink-500 hover:bg-ink-100")}>{l}</button>)}</div>
    {sub==="financier"&&<div className="space-y-5">
      <Card title="Mes comptes et avoirs" sub="Comptes, livrets, assurance vie, espèces. Tes investissements (bourse, PE, crypto, PER) sont dans l'onglet Investissements." right={<AjouterMenu options={SUGG_PATRI.map(([label,classe])=>({label,pick:()=>addAsset(label,classe)}))} onBlank={addA}/>}>
        <div className="space-y-2">
          {data.patrimoine.map(a=>{const pv=n(a.prixRevient)>0?(n(a.montant)-n(a.prixRevient)):null; const det=detteFor(a.id); const o=open[a.id];return(
            <div key={a.id} className="rounded-2xl border border-ink-100">
              <div className="flex items-center gap-2 p-2">
                <button onClick={()=>setOpen(s=>({...s,[a.id]:!o}))} className="text-ink-300 hover:text-brand-600 w-7 h-7 rounded-lg hover:bg-ink-100 cursor-pointer shrink-0">{o?"▾":"▸"}</button>
                <div className="flex-1 min-w-[120px]"><TextInput value={a.nom} onChange={v=>updA(a.id,{nom:v})} placeholder="Ex : Livret A"/></div>
                <select value={a.classe} onChange={e=>updA(a.id,{classe:e.target.value})} className="w-32 text-sm rounded-xl border border-ink-200 py-2 px-2 text-ink-600 bg-white">{CLASSES.map(cl=><option key={cl} value={cl}>{cl}</option>)}</select>
                <Money value={a.montant} onChange={v=>updA(a.id,{montant:v})} className="w-32"/>
                <IconBtn name="x" onClick={()=>delA(a.id)}/>
              </div>
              {o&&(()=>{const isLiq=a.classe==="Liquidités"; const costLabel=a.classe==="Immobilier"?"Coût total (achat + frais + travaux)":"Montant investi";
                return(<div className="px-3 pb-3 pt-2 border-t border-ink-100 grid sm:grid-cols-2 gap-3">
                <Field label="Où c'est placé (banque, courtier)"><TextInput value={a.etablissement||""} onChange={v=>updA(a.id,{etablissement:v})} placeholder="Facultatif"/></Field>
                <Field label="Pays"><TextInput value={a.pays||""} onChange={v=>updA(a.id,{pays:v})} placeholder="Facultatif"/></Field>
                {!isLiq&&<Field label={costLabel}><Money value={a.prixRevient||0} onChange={v=>updA(a.id,{prixRevient:v})}/></Field>}
                {!isLiq&&<div className="flex flex-col justify-end text-sm pb-1">{pv!=null&&<div>Plus-value latente : <b className={pv>=0?"text-brand-700":"text-red-500"}>{fmtE(pv)}</b></div>}{pv==null&&<div className="text-xs text-ink-400">Indique le montant investi pour voir ta plus-value.</div>}</div>}
                {isLiq&&<div className="sm:col-span-2 text-xs text-ink-400">Pas de plus-value sur des liquidités, c'est du cash disponible.</div>}
              </div>);})()}
            </div>);})}
        </div>
        <div className="flex justify-between mt-3 pt-3 border-t border-ink-200 text-sm"><span className="font-heading font-semibold text-ink-700">Total financier</span><span className="font-heading font-bold text-brand-700">{fmtE(finBrut)}</span></div>
      </Card>
      <Card title="Mes crédits"><div className="flex items-center justify-between"><div className="text-sm text-ink-600">Capital restant dû, déduit de ton patrimoine net.</div><div className="font-heading font-bold text-red-500">{fmtE(c.dettesT)}</div></div>
        <p className="text-xs text-ink-400 mt-2">Les crédits se gèrent dans l'onglet <b>Cashflow</b> (mensualités = dépenses) ou via l'assistant guidé.</p></Card>
    </div>}
    {sub==="immobilier"&&<Immobilier data={data} setData={setData}/>}
    {sub==="bourse"&&<Bourse data={data} setData={setData}/>}
  </div>);
}

/* Immobilier (3 modes : RP / Locatif / MDB) */
const IMMO_MODES=[["RP","Résidence principale"],["Locatif","Locatif"],["MDB","Achat / revente"]];
function coutRevient(b){ return n(b.prixAchat)+n(b.fraisNotaire)+n(b.fraisAgence)+n(b.travaux); }
function Acquisition({b,upd}){
  return (<div>
    <div className="grid sm:grid-cols-2 lg:grid-cols-4 gap-3">
      <Field label="Prix d'achat (net vendeur)"><Money value={b.prixAchat} onChange={v=>upd(b.id,{prixAchat:v})}/></Field>
      <Field label="Frais de notaire"><Money value={b.fraisNotaire} onChange={v=>upd(b.id,{fraisNotaire:v})}/></Field>
      <Field label="Frais d'agence"><Money value={b.fraisAgence} onChange={v=>upd(b.id,{fraisAgence:v})}/></Field>
      <Field label="Travaux (cumul, à mettre à jour)"><Money value={b.travaux} onChange={v=>upd(b.id,{travaux:v})}/></Field>
    </div>
    <p className="text-xs text-ink-400 mt-2">Repère : notaire environ 7 à 8% du prix dans l'ancien (2 à 3% dans le neuf), agence souvent 3 à 6%. Coût de revient (achat + frais + travaux) : <b className="text-ink-600">{fmtE(coutRevient(b))}</b>.</p>
  </div>);
}
function ValeurEstimee({b,upd}){
  const cr=coutRevient(b);
  return (<Field label="Valeur actuelle estimée">
    <Money value={b.valeur} onChange={v=>upd(b.id,{valeur:v})}/>
    <div className="flex items-center gap-2 mt-1 flex-wrap"><span className="text-xs text-ink-400">Une estimation au prix du marché suffit.</span>
      {cr>0&&<button onClick={()=>upd(b.id,{valeur:cr})} className="text-xs text-brand-700 hover:underline cursor-pointer">utiliser le coût de revient ({fmtE(cr)})</button>}</div>
  </Field>);
}
function CreditBien({b,upd}){
  return (<div className="rounded-2xl bg-ink-50/70 border border-ink-100 p-3">
    <div className="text-sm font-medium text-ink-700 mb-2">Dette liée à ce bien <span className="text-xs font-normal text-ink-400">· crédit immobilier (laisse à 0 si le bien est payé)</span></div>
    <div className="grid sm:grid-cols-2 lg:grid-cols-4 gap-3">
      <Field label="Capital restant dû"><Money value={b.capital} onChange={v=>upd(b.id,{capital:v})}/></Field>
      <Field label="Mensualité"><Money value={b.mensualite} onChange={v=>upd(b.id,{mensualite:v})}/></Field>
      <Field label="Taux d'intérêt"><Pct value={b.taux} onChange={v=>upd(b.id,{taux:v})}/></Field>
      <Field label="Frais de dossier / garantie"><Money value={b.fraisCredit} onChange={v=>upd(b.id,{fraisCredit:v})}/></Field>
    </div>
    {b.usage==="RP"&&<label className="flex items-center gap-2 mt-3 text-sm text-ink-600 cursor-pointer">
      <input type="checkbox" checked={!!b.rpCashflow} onChange={e=>upd(b.id,{rpCashflow:e.target.checked})} className="w-4 h-4 accent-brand-600 cursor-pointer"/>
      Compter cette mensualité comme dépense fixe dans mon Cashflow <span className="text-xs text-ink-400">(évite de la saisir aussi en dépense)</span></label>}
  </div>);
}
function Immobilier({data,setData}){
  const [mode,setMode]=useState("RP");
  const [open,setOpen]=useState({});
  const biens=data.biens||[];
  const list=biens.filter(b=>(b.usage||"RP")===mode);
  const upd=(id,p)=>setData(d=>({...d,biens:(d.biens||[]).map(b=>b.id===id?{...b,...p}:b)}));
  const del=id=>setData(d=>({...d,biens:(d.biens||[]).filter(b=>b.id!==id)}));
  const add=()=>setData(d=>({...d,biens:[...(d.biens||[]),{id:uid(),usage:mode,nom:"Nouveau bien",prixAchat:0,fraisNotaire:0,fraisAgence:0,fraisCredit:0,travaux:0,valeur:0,loyer:0,charges:0,taxe:0,vacance:0,capital:0,mensualite:0,taux:0.03,prixRevente:0,portageMois:0,dureeMois:6,fraisRevente:0,tauxIS:0.25}]}));
  const addUsage=u=>{ setMode(u); setData(d=>({...d,biens:[...(d.biens||[]),{id:uid(),usage:u,nom:u==="MDB"?"Nouvelle opération":"Nouveau bien",prixAchat:0,fraisNotaire:0,fraisAgence:0,fraisCredit:0,travaux:0,valeur:0,loyer:0,charges:0,taxe:0,vacance:0,capital:0,mensualite:0,taux:0.03,prixRevente:0,portageMois:0,dureeMois:6,fraisRevente:0,tauxIS:0.25}]})); };
  const mc=data.mois[data.moisActif]||{depenses:[]};
  const logementMois=sum(mc.depenses.filter(p=>groupeOf(p.nom)==="Logement"),x=>x.montant);
  const detteLiee=bid=>sum((data.dettes||[]).filter(x=>x.bienLie===bid),x=>x.montant);

  const calcLoc=b=>{const occ=(12-Math.min(12,n(b.vacance)))/12, cr=coutRevient(b), loyerAn=n(b.loyer)*12*occ;
    return {cr, occ, pv:n(b.valeur)-cr-detteLiee(b.id), equity:n(b.valeur)-n(b.capital)-detteLiee(b.id),
      rdtBrut:cr>0?loyerAn/cr:0, rdtNet:cr>0?(loyerAn-n(b.charges)*12-n(b.taxe))/cr:0,
      cfMois:n(b.loyer)*occ-n(b.charges)-n(b.taxe)/12-n(b.mensualite)};};
  const calcMdb=b=>{const fa=n(b.fraisNotaire)+n(b.fraisAgence), portage=n(b.portageMois)*n(b.dureeMois), coutTot=n(b.prixAchat)+fa+n(b.travaux)+portage+n(b.fraisRevente);
    const margeBrute=n(b.prixRevente)-n(b.prixAchat)-fa-n(b.travaux), margeNet=n(b.prixRevente)-coutTot, is=Math.max(0,margeNet*n(b.tauxIS)), net=margeNet-is;
    return {portage,coutTot,margeBrute,margeNet,is,net, roi:coutTot>0?net/coutTot:0, roiAn:n(b.dureeMois)>0?(coutTot>0?net/coutTot:0)*12/n(b.dureeMois):0};};

  let kpis=[];
  if(mode==="RP"){ const t=list.reduce((s,b)=>{s.val+=n(b.valeur);s.cr+=coutRevient(b);s.cap+=n(b.capital);s.dl+=detteLiee(b.id);return s;},{val:0,cr:0,cap:0,dl:0});
    kpis=[["Valeur des biens",fmtE(t.val),"home","blue"],["Coût de revient",fmtE(t.cr),null,"ink"],["Plus-value latente",fmtE(t.val-t.cr-t.dl),null,(t.val-t.cr-t.dl)>=0?"blue":"red"],["Valeur nette",fmtE(t.val-t.cap-t.dl),null,"blue"]]; }
  else if(mode==="Locatif"){ const t=list.reduce((s,b)=>{const c=calcLoc(b);s.val+=n(b.valeur);s.cf+=c.cfMois;s.pv+=c.pv;s.loyerAn+=n(b.loyer)*12*c.occ;s.net+=(n(b.loyer)*12*c.occ-n(b.charges)*12-n(b.taxe));s.cr+=c.cr;return s;},{val:0,cf:0,pv:0,loyerAn:0,net:0,cr:0});
    kpis=[["Valeur des biens",fmtE(t.val),"home","blue"],["Cashflow locatif",fmtE(t.cf)+" / mois",null,t.cf>=0?"blue":"red"],["Rendement net moyen",fmtP(t.cr>0?t.net/t.cr:0),null,"blue"],["Plus-value latente",fmtE(t.pv),null,t.pv>=0?"blue":"red"]]; }
  else { const t=list.reduce((s,b)=>{const c=calcMdb(b);s.eng+=n(b.prixAchat)+n(b.fraisNotaire)+n(b.fraisAgence)+n(b.travaux);s.rev+=n(b.prixRevente);s.net+=c.net;return s;},{eng:0,rev:0,net:0});
    kpis=[["Capital engagé",fmtE(t.eng),null,"ink"],["Revente estimée",fmtE(t.rev),null,"blue"],["Marge nette estimée",fmtE(t.net),null,t.net>=0?"blue":"red"],["Opérations",list.length,null,"ink"]]; }

  const tips=[];
  if(mode==="Locatif") list.forEach(b=>{const cc=calcLoc(b); if(coutRevient(b)>0){ if(cc.cfMois<0) tips.push({tone:"warn",titre:b.nom,txt:"cashflow négatif de "+fmtE(-cc.cfMois)+" par mois. Vérifie loyer, charges ou financement."}); else if(cc.rdtNet<0.03) tips.push({tone:"info",titre:b.nom,txt:"rendement net faible ("+fmtP(cc.rdtNet)+"). Sous 3%, l'effet de levier rapporte peu."}); }});
  if(mode==="MDB") list.forEach(b=>{const cc=calcMdb(b); if(n(b.prixRevente)>0&&cc.net<0) tips.push({tone:"warn",titre:b.nom,txt:"marge nette négative. Revois prix de revente, travaux ou durée de portage."}); else if(cc.roiAn>0&&cc.roiAn<0.1) tips.push({tone:"info",titre:b.nom,txt:"rentabilité annualisée modeste ("+fmtP(cc.roiAn)+")."});});
  if(mode==="RP") list.forEach(b=>{const pv=n(b.valeur)-coutRevient(b); if(pv>0) tips.push({tone:"good",titre:b.nom,txt:"plus-value latente de "+fmtE(pv)+", exonérée à la revente."});});

  return (<div className="space-y-5">
    <div className="panel rounded-2xl p-1.5 flex gap-1 w-fit">
      {IMMO_MODES.map(([k,l])=><button key={k} onClick={()=>setMode(k)} className={"px-4 py-2 rounded-xl text-sm font-medium cursor-pointer transition "+(mode===k?"bg-gradient-to-br from-brand-500 to-brand-700 text-white shadow":"text-ink-500 hover:bg-ink-100")}>{l}</button>)}
    </div>
    <div className="grid grid-cols-2 sm:grid-cols-4 gap-4">
      {kpis.map((k,i)=><KPI key={i} label={k[0]} value={k[1]} icon={k[2]} tone={k[3]}/>)}
    </div>

    <Card title={mode==="RP"?"Ma résidence principale":mode==="Locatif"?"Mes biens locatifs":"Mes opérations d'achat / revente"}
      sub={mode==="RP"?"Le logement où tu vis. On suit sa valeur, pas un rendement.":mode==="Locatif"?"Biens loués. Rendement, cashflow et fiscalité.":"Achat, rénovation, revente. On pilote la marge de l'opération."}
      right={<AddBtn onClick={add}>Ajouter</AddBtn>}>
      {list.length===0&&<div className="text-sm text-ink-400 py-4 text-center">Aucun bien ici. Ajoute le tien.</div>}
      <div className="space-y-3">{list.map(b=>{const o=open[b.id]; return(
        <div key={b.id} className="rounded-2xl border border-ink-100">
          <div className="flex items-center gap-2 p-2">
            <button onClick={()=>setOpen(s=>({...s,[b.id]:!o}))} className="text-ink-300 hover:text-brand-600 w-7 h-7 rounded-lg hover:bg-ink-100 cursor-pointer shrink-0">{o?"▾":"▸"}</button>
            <div className="flex-1 min-w-[120px]"><TextInput value={b.nom} onChange={v=>upd(b.id,{nom:v})} placeholder={mode==="MDB"?"Ex : maison à rénover":"Ex : appartement Lyon"}/></div>
            <Money value={mode==="MDB"?b.prixRevente:b.valeur} onChange={v=>upd(b.id,mode==="MDB"?{prixRevente:v}:{valeur:v})} className="w-32"/>
            <IconBtn name="x" onClick={()=>del(b.id)} title="Supprimer"/>
          </div>
          {o&&<div className="px-3 pb-3 pt-2 border-t border-ink-100 space-y-4">
            <div className="flex flex-wrap items-center gap-2 text-sm"><span className="text-ink-500">Type :</span>
              <select value={b.usage} onChange={e=>upd(b.id,{usage:e.target.value})} className="text-sm rounded-xl border border-ink-200 py-1.5 px-2 text-ink-600 bg-white">{IMMO_MODES.map(([k,l])=><option key={k} value={k}>{l}</option>)}</select>
              <span className="text-ink-400 text-xs">changer le mode déplace ce bien (l'achat, les frais et les travaux sont conservés)</span></div>
            <Acquisition b={b} upd={upd}/>
            {mode==="RP"&&<>
              <div className="grid sm:grid-cols-3 gap-3">
                <ValeurEstimee b={b} upd={upd}/>
              </div>
              <CreditBien b={b} upd={upd}/>
              <div className="grid grid-cols-2 sm:grid-cols-4 gap-3">
                <Mini label="Coût de revient" v={fmtE(coutRevient(b))}/>
                <Mini label="Plus-value latente" v={fmtE(n(b.valeur)-coutRevient(b)-detteLiee(b.id))} tone={(n(b.valeur)-coutRevient(b)-detteLiee(b.id))>=0?"brand":"red"}/>
                <Mini label="Valeur nette" v={fmtE(n(b.valeur)-n(b.capital)-detteLiee(b.id))}/>
                <Mini label="Charges du logement" v={fmtE(logementMois)+" / mois"}/>
              </div>
              {detteLiee(b.id)>0&&<p className="text-xs text-ink-400">Dont {fmtE(detteLiee(b.id))} de dette rattachée à ce bien (saisie dans Cashflow → Dettes et crédits), déduite de sa plus-value latente.</p>}
              <p className="text-xs text-ink-400">Les charges récurrentes (électricité, eau, copro, crédit) de ta résidence principale sont suivies dans <b>Cashflow, poste Logement</b> ({fmtE(logementMois)}/mois) et ne sont pas recomptées ici. La plus-value de revente d'une résidence principale est exonérée d'impôt.</p>
            </>}
            {mode==="Locatif"&&(()=>{const c=calcLoc(b);return(<>
              <div className="grid sm:grid-cols-3 gap-3">
                <ValeurEstimee b={b} upd={upd}/>
                <Field label="Loyer perçu hors charges (mensuel)"><Money value={b.loyer} onChange={v=>upd(b.id,{loyer:v})}/></Field>
                <Field label="Charges non récupérables (mensuel)"><Money value={b.charges} onChange={v=>upd(b.id,{charges:v})}/></Field>
                <Field label="Taxe foncière (annuelle)"><Money value={b.taxe} onChange={v=>upd(b.id,{taxe:v})}/></Field>
                <Field label="Vacance (mois / an)"><Money value={b.vacance} onChange={v=>upd(b.id,{vacance:v})} suffix="m"/></Field>
              </div>
              <CreditBien b={b} upd={upd}/>
              <div className="grid grid-cols-2 sm:grid-cols-5 gap-3">
                <Mini label="Cashflow / mois" v={fmtE(c.cfMois)} tone={c.cfMois>=0?"brand":"red"}/>

/* Outils : calculateur d'opération marchand de biens */
function bilanMdb(m, caMult, travMult){
  m=m||{}; caMult=caMult||1; travMult=travMult||1;
  const tva=n(m.tauxTVA)||0.2;
  const regime=(m.regimeOverride&&m.regimeOverride!=="auto")?m.regimeOverride:(m.bienNeuf?"total":(m.achatTaxe?"exoneration":"marge"));
  const recup=regime==="total";
  const fraisAcq=n(m.prixAchat)*n(m.fraisAcqPct);
  const foncier=n(m.prixAchat)+n(m.indemniteEviction)+fraisAcq+n(m.apporteur);
  const travauxBrut=(n(m.vrd)+n(m.grosOeuvre)+n(m.travauxNeufs)+n(m.equipement)+n(m.honoTech)+n(m.raccordements))*travMult;
  const aleas=travauxBrut*n(m.aleasPct);
  const techniqueHT=travauxBrut+aleas;
  const honoDivers=n(m.honoGestion)+n(m.honoCompta)+n(m.honoJustice);
  const diversHorsTVA=travauxBrut*(n(m.doPct)+n(m.gfaPct));
  const CA=sum(m.lots||[],l=>l.prix)*caMult;
  const honoVente=CA*n(m.honoVentePct);
  const fraisFin=n(m.emprunt)*n(m.tauxEmprunt)*(n(m.dureeMois)/12)+n(m.fraisDossier);
  const coef=recup?1:(1+tva);
  const coutTechnique=techniqueHT*coef, coutHonoDivers=honoDivers*coef;
  const coutHonoVente=recup?honoVente/(1+tva):honoVente;
  const caRef=recup?CA/(1+tva):CA;
  const margeTTC=CA-foncier;
  const tvaMarge=regime==="marge"?Math.max(0,margeTTC)*tva/(1+tva):0;
  const coutTotal=foncier+coutTechnique+coutHonoDivers+diversHorsTVA+fraisFin+coutHonoVente+tvaMarge;
  const resultat=caRef-coutTotal;
  const is=resultat<=0?0:(m.isReduit?0.15*Math.min(resultat,42500)+0.25*Math.max(0,resultat-42500):0.25*resultat);
  const net=resultat-is;
  return {regime,recup,fraisAcq,foncier,travauxBrut,aleas,techniqueHT,coutTechnique,honoDivers,coutHonoDivers,coutHonoVente,caRef,diversHorsTVA,CA,honoVente,fraisFin,margeTTC,tvaMarge,coutRevient:foncier+coutTechnique+coutHonoDivers+diversHorsTVA,coutTotal,resultat,is,net,
    margeCA:CA?net/CA:0, roe:n(m.apport)?net/n(m.apport):null, rentAn:(n(m.apport)&&n(m.dureeMois))?(net/n(m.apport))*12/n(m.dureeMois):null};
}

function mdbChecks(m,r,pointMort){
  const out=[]; const push=(level,txt)=>out.push({level,txt});
  const recompo=r.foncier+r.coutTechnique+r.coutHonoDivers+r.diversHorsTVA+r.coutHonoVente+r.fraisFin+r.tvaMarge+r.resultat;
  const equil=Math.abs(r.caRef-recompo)<1;
  push(equil?"ok":"err", equil?"Comptes équilibrés : chiffre d'affaires = coûts + résultat avant impôt.":"Incohérence comptable dans la décomposition du résultat.");
  const besoin=r.foncier+r.coutTechnique, ressources=n(m.apport)+n(m.emprunt);
  if(besoin>0){ if(ressources+1<besoin) push("warn","Le financement (apport + emprunt) ne couvre pas l'achat et les travaux : manque "+fmtE(besoin-ressources)+".");
    else push("ok","Le financement couvre l'achat et les travaux."); }
  if(r.CA>0){ if(r.net<0) push("err","Opération à perte : bénéfice net négatif ("+fmtE(r.net)+").");
    else if(r.margeCA<0.08) push("warn","Marge nette faible ("+fmtP(r.margeCA)+" du CA, repère 8 à 12%) : peu de sécurité.");

/* Outils : simulateur de rentabilité locative (façon Horiz) */
function mensualite(capital,tauxAnnuel,annees){
  const N=Math.round(annees*12); if(N<=0)return 0; const t=tauxAnnuel/12;
  if(!t) return capital/N;
  return capital*t/(1-Math.pow(1+t,-N));
}
// Tableau d'amortissement agrege par annee. Assurance emprunteur calculee sur le capital initial (constante).
function amortissement(capital,tauxAnnuel,annees,assAnnuelPct){
  capital=n(capital); const N=Math.round(n(annees)*12); const t=n(tauxAnnuel)/12;
  if(capital<=0||N<=0) return {rows:[],totInt:0,totAss:0,mens:0,coutTotal:0,N:0};
  const mens=t?capital*t/(1-Math.pow(1+t,-N)):capital/N;
  const assMois=capital*n(assAnnuelPct)/12;
  let crd=capital, totInt=0; const years={};
  for(let mo=1;mo<=N;mo++){
    const interet=crd*t; let principal=(mo===N)?crd:(mens-interet); crd=Math.max(0,crd-principal); totInt+=interet;
    const y=Math.ceil(mo/12); if(!years[y]) years[y]={annee:y,interets:0,principal:0,assurance:0,crd:0};
    years[y].interets+=interet; years[y].principal+=principal; years[y].assurance+=assMois; years[y].crd=crd;
  }
  const totAss=assMois*N;
  return {rows:Object.values(years), totInt, totAss, mens, assMois, coutTotal:totInt+totAss, N};
}
// Plus-value immobiliere des particuliers : abattements pour duree de detention.
function abattementIR(a){ if(a<6)return 0; let ab=(Math.min(a,21)-5)*0.06; if(a>=22)ab+=0.04; return Math.min(1,ab); } // exoneration a 22 ans
function abattementPS(a){ if(a<6)return 0; let ab=(Math.min(a,21)-5)*0.0165; if(a>=22)ab+=0.016; if(a>22)ab+=(Math.min(a,30)-22)*0.09; return Math.min(1,ab); } // exoneration a 30 ans
function surtaxePV(pv){ pv=n(pv); if(pv<=50000)return 0;
  if(pv<=60000)return pv*0.02-(60000-pv)/20; if(pv<=100000)return pv*0.02;
  if(pv<=110000)return pv*0.03-(110000-pv)/10; if(pv<=150000)return pv*0.03;
  if(pv<=160000)return pv*0.04-(160000-pv)*15/100; if(pv<=200000)return pv*0.04;
  if(pv<=210000)return pv*0.05-(210000-pv)*20/100; if(pv<=250000)return pv*0.05;
  if(pv<=260000)return pv*0.06-(260000-pv)*25/100; return pv*0.06; }
function plusValueRevente(m,am){
  const prixAchat=n(m.prix), prixRevente=n(m.prixRevente), annees=Math.max(0,Math.round(n(m.dureeDetention)));
  if(prixRevente<=0||prixAchat<=0||annees<=0) return null;
  const fraisReels=prixAchat*n(m.notairePct)+n(m.fraisAgence);
  const fraisRetenu=Math.max(fraisReels,0.075*prixAchat); // forfait 7,5% possible
  const travauxRetenu=Math.max(n(m.travaux), annees>5?0.15*prixAchat:0); // forfait 15% si detention > 5 ans
  const prixMajore=prixAchat+fraisRetenu+travauxRetenu;
  const pvBrute=prixRevente-prixMajore;
  const abIR=abattementIR(annees), abPS=abattementPS(annees);
  const baseIR=Math.max(0,pvBrute*(1-abIR)), basePS=Math.max(0,pvBrute*(1-abPS));
  const impotIR=baseIR*0.19, impotPS=basePS*0.172, surtaxe=pvBrute>0?surtaxePV(baseIR):0;
  const impotTotal=pvBrute>0?(impotIR+impotPS+surtaxe):0;
  const crd=(am&&am.rows&&am.rows.length)?( (am.rows[Math.min(annees,am.rows.length)-1]||{}).crd || (annees>=am.N?0:0) ):0;
  const fraisVente=n(m.fraisVente);
  const netEnPoche=prixRevente-crd-fraisVente-impotTotal;
  return {prixMajore,pvBrute,abIR,abPS,baseIR,basePS,impotIR,impotPS,surtaxe,impotTotal,crd,fraisVente,netEnPoche,annees};
}
// TRI (taux de rentabilite interne) par bissection sur une serie de flux (flux[0] = investissement initial, negatif).
function tri(flux){
  const npv=r=>flux.reduce((s,f,i)=>s+n(f)/Math.pow(1+r,i),0);
  let lo=-0.95, hi=1.5; const a=npv(lo), b=npv(hi);
  if(!isFinite(a)||!isFinite(b)||a*b>0) return null;
  for(let k=0;k<200;k++){ const mid=(lo+hi)/2, v=npv(mid); if(Math.abs(v)<0.5) return mid; if(npv(lo)*v<0) hi=mid; else lo=mid; }
  return (lo+hi)/2;
}

function bilanLocatif(m){
  m=m||{};
  const prix=n(m.prix),travaux=n(m.travaux),agence=n(m.fraisAgence),mobilier=n(m.mobilier);
  const notaire=prix*n(m.notairePct);
  const coutTotal=prix+notaire+travaux+agence+mobilier;
  const loyerAn=n(m.loyerMensuel)*12, vac=n(m.vacancePct), loyerEff=loyerAn*(1-vac);
  const gestion=loyerAn*n(m.gestionPct), gli=loyerAn*n(m.gliPct);
  const charges=n(m.taxeFonciere)+n(m.coproAn)+n(m.assurancePNO)+gestion+gli+n(m.comptaAn);
  const emprunt=n(m.emprunt), mCredit=mensualite(emprunt,n(m.tauxEmprunt),n(m.dureeAnnees));
  const mAssur=emprunt*n(m.assEmprunteurPct)/12, mensualiteTot=mCredit+mAssur;
  const interets1=emprunt*n(m.tauxEmprunt), capital1=Math.max(0,mCredit*12-interets1);
  const amortBien=(prix*0.85+travaux)/30, amortMob=mobilier/8, amort=amortBien+amortMob;
  const tmi=n(m.tmi), ps=0.172, reg=m.regime||"microfoncier";
  let base=0, deficit=0;
  if(reg==="microfoncier") base=loyerEff*0.7;
  else if(reg==="microbic") base=loyerEff*0.5;
  else if(reg==="reelfoncier") base=loyerEff-charges-interets1-mAssur*12;
  else base=loyerEff-charges-interets1-mAssur*12-amort;
  let impot=0;
  if(base>0) impot=base*(tmi+ps); else { deficit=-base; }
  const cashflowAn=loyerEff-charges-mensualiteTot*12-impot, cashflowMois=cashflowAn/12;
  const enrichMois=cashflowMois+capital1/12;
  const brut=coutTotal?loyerAn/coutTotal:0, net=coutTotal?(loyerEff-charges)/coutTotal:0, netnet=coutTotal?(loyerEff-charges-impot)/coutTotal:0;
  const apport=n(m.apport), cashOnCash=apport?cashflowAn/apport:null;
  return {prix,notaire,travaux,agence,mobilier,coutTotal,loyerAn,loyerEff,vac,gestion,gli,charges,emprunt,mCredit,mAssur,mensualiteTot,interets1,capital1,amort,amortBien,amortMob,base,impot,deficit,regime:reg,tmi,cashflowAn,cashflowMois,enrichMois,brut,net,netnet,cashOnCash,apport};
}

function locatifChecks(m,r){
  const out=[]; const push=(level,txt)=>out.push({level,txt});
  const equil=Math.abs(r.cashflowAn-(r.loyerEff-r.charges-r.mensualiteTot*12-r.impot))<1;
  push(equil?"ok":"err", equil?"Comptes équilibrés : cashflow = loyers − charges − crédit − impôt.":"Incohérence dans le calcul du cashflow.");
  if(r.coutTotal>0){ const res=n(m.apport)+n(m.emprunt);
    if(res+1<r.coutTotal) push("warn","Apport + emprunt ne couvrent pas le coût total : manque "+fmtE(r.coutTotal-res)+".");
    else if(res>r.coutTotal+1) push("info","Financement supérieur au coût total de "+fmtE(res-r.coutTotal)+" : apport peut-être surestimé.");
    else push("ok","Le financement couvre le coût total de l'opération."); }
  if(r.loyerAn>0){ if(r.netnet<0) push("err","Rentabilité nette-nette négative : charges et impôt dépassent les loyers.");
    else if(r.netnet<0.035) push("warn","Rentabilité nette-nette faible ("+fmtP(r.netnet)+", repère > 3,5 à 4%).");
    else push("ok","Rentabilité nette-nette correcte ("+fmtP(r.netnet)+")."); }
  if(r.loyerAn>0){ if(r.cashflowMois<0) push("warn","Cashflow négatif : effort d'épargne de "+fmtE(-r.cashflowMois)+" par mois.");
    else push("ok","Cashflow positif : "+fmtE(r.cashflowMois)+" par mois."); }
  if(r.coutTotal>0&&r.loyerAn>0&&r.brut<0.03) push("info","Rendement brut bas ("+fmtP(r.brut)+") : loyer faible par rapport au prix.");
  if(r.regime==="microfoncier"&&r.loyerAn>15000) push("warn","Micro-foncier non applicable au-delà de 15 000 € de loyers nus par an : passe au régime réel.");
  if(r.regime==="microbic"&&r.loyerAn>77700) push("warn","Micro-BIC non applicable au-delà de 77 700 € de recettes : passe au LMNP réel.");
  if((r.regime==="microbic"||r.regime==="lmnp")&&n(m.mobilier)===0) push("info","Location meublée : pense à valoriser le mobilier (requis, et amortissable en LMNP réel).");
  if(r.mensualiteTot>0&&n(m.loyerMensuel)>0&&r.mensualiteTot>n(m.loyerMensuel)) push("info","La mensualité ("+fmtE(r.mensualiteTot)+") dépasse le loyer ("+fmtE(n(m.loyerMensuel))+") : autofinancement difficile.");
  if(r.loyerAn>0&&n(m.vacancePct)===0) push("info","Aucune vacance ni impayé provisionnés : prévois 3 à 8% par prudence.");
  if(n(m.prix)>0&&n(m.notairePct)<0.03) push("info","Frais de notaire bas ("+fmtP(n(m.notairePct))+") : plutôt cohérent avec du neuf.");
  if(r.loyerAn===0) push("info","Renseigne le loyer mensuel pour lancer le calcul.");
  return out;
}

/* Cashflow */
function Cashflow({data,setData,mc,setMc,moisActif,c}){
  const changeMois=ym=>setData(d=>{ if(!d.mois[ym]){ const keys=Object.keys(d.mois).sort(); const src=d.mois[keys[keys.length-1]]||{revenus:[],depenses:[]};
      const cl=a=>a.map(x=>({...x,id:uid()})); return {...d,moisActif:ym,mois:{...d.mois,[ym]:{revenus:cl(carryRev(src.revenus)),depenses:cl(carryDep(src.depenses))}}}; }
    return {...d,moisActif:ym}; });
  const upd=(k,id,patch)=>setMc(k,mc[k].map(x=>x.id===id?{...x,...patch}:x));
  const del=(k,id)=>setMc(k,mc[k].filter(x=>x.id!==id));
  const updC=(id,p)=>setData(d=>({...d,dettes:d.dettes.map(x=>x.id===id?{...x,...p}:x)}));
  const delC=id=>setData(d=>({...d,dettes:d.dettes.filter(x=>x.id!==id)}));

  const addDepNamed=(nom,cat)=>setMc("depenses",[...mc.depenses,{id:uid(),nom,montant:0,cat:cat||"variable"}]);
  const dejaR=new Set(mc.revenus.map(r=>(r.nom||"").toLowerCase())), dejaD=new Set(mc.depenses.map(p=>(p.nom||"").toLowerCase()));
  const mois=Object.keys(data.mois).sort();
  const moisIdx=mois.indexOf(moisActif); const moisPrec=moisIdx>0?mois[moisIdx-1]:null;
  const depPrecList=moisPrec?((data.mois[moisPrec]||{}).depenses||[]):[];
  const depPrec=sum(depPrecList,x=>x.montant); const deltaDep=depPrec>0?(c.depCourante-depPrec)/depPrec:null;
  const immoList=(data.biens||[]).filter(b=>b.usage==="RP"||b.usage==="Locatif");
  const tfixe=sum(mc.depenses.filter(p=>(p.cat||"variable")==="fixe"),x=>x.montant); const tvar=c.depCourante-tfixe;
  const verdict = c.tauxEpargne>=0.5?{t:"Excellent",c:"text-brand-700",d:"Tu épargnes plus de la moitié de tes revenus."}
    : c.tauxEpargne>=0.2?{t:"Correct",c:"text-sky-700",d:"Au-dessus du seuil sain de 20%. Tes dépenses variables sont le levier pour monter plus haut."}
    : {t:"À améliorer",c:"text-amber-700",d:"Sous le seuil sain de 20%. Agis d'abord sur tes dépenses variables."};
  const tips=[];
  if(c.cashflow<0) tips.push({tone:"warn",titre:"Cashflow négatif",txt:"tu dépenses plus que tu ne gagnes ce mois. Réduis d'abord tes plus gros postes."});
  else if(c.tauxEpargne>=0.5) tips.push({tone:"good",titre:"Très bon taux d'épargne",txt:"tu mets de côté "+fmtP(c.tauxEpargne)+", soit "+fmtE(c.cashflow*12)+" par an à investir."});
  return (<div className="space-y-5">
    <Card><div className="flex flex-wrap items-center gap-3">
      <label className="text-sm text-ink-600 font-medium">Mois :</label>
      <input type="month" value={moisActif} onChange={e=>changeMois(e.target.value)} className="px-3 py-2 rounded-xl border border-ink-200 bg-white focus:border-brand-400 outline-none"/>
      <span className="text-xs text-ink-400">{mois.length} mois enregistré{mois.length>1?"s":""}. À l'ouverture, l'app se place sur le mois en cours.</span>
      <div className="ml-auto flex gap-4 text-sm flex-wrap">
        <span className="text-ink-500">Revenus <b className="text-brand-700">{fmtE(c.revT)}</b></span>
        <span className="text-ink-500">Dépenses <b className="text-red-500">{fmtE(c.depCourante)}</b></span>
        <span className="text-ink-500">Crédits <b className="text-red-500">{fmtE(c.mensuCredits)}</b></span>
        {c.rpMensu>0&&<span className="text-ink-500">Crédit résidence <b className="text-red-500">{fmtE(c.rpMensu)}</b></span>}
        <span className="text-ink-500">Cashflow <b className="text-sky-600">{fmtE(c.cashflow)}</b></span></div></div></Card>
    <div className="grid md:grid-cols-2 gap-5 items-start">
      <Card title="Revenus" sub="À renseigner de préférence en fin de mois, une fois ton salaire reçu et tes dépenses du mois connues." right={<AjouterMenu options={SUGG_REV.map(([label,type])=>({label,pick:()=>addRevNamed(label,type)}))} onBlank={()=>setMc("revenus",[...mc.revenus,{id:uid(),nom:"Nouveau revenu",montant:0,type:"passif"}])}/>}>
        <div className="space-y-2">{mc.revenus.map(r=>(<div key={r.id} className="flex items-center gap-2">
          <div className="flex-1"><TextInput value={r.nom} onChange={v=>upd("revenus",r.id,{nom:v})}/></div>
          <select value={r.type} onChange={e=>upd("revenus",r.id,{type:e.target.value})} className="text-xs rounded-lg border border-ink-200 py-2 px-1.5 text-ink-600 bg-white"><option value="actif">actif</option><option value="passif">passif</option></select>
          <Money value={r.montant} onChange={v=>upd("revenus",r.id,{montant:v})} className="w-28"/>
          <IconBtn name="x" onClick={()=>del("revenus",r.id)} title="Supprimer"/></div>))}</div>
        <Total label="Total revenus" v={c.revT}/></Card>
      <Card title="Dépenses du mois" sub="Fixe ou variable = récurrent (reporté chaque mois). Ponctuelle = dépense exceptionnelle, comptée ce mois-ci seulement et non reportée. Le % indique le poids dans tes revenus." right={<AjouterMenu options={SUGG_DEP.map(([label,cat])=>({label,pick:()=>addDepNamed(label,cat)}))} onBlank={()=>setMc("depenses",[...mc.depenses,{id:uid(),nom:"Nouvelle dépense",montant:0,cat:"variable"}])}/>}>
        {["fixe","variable","ponctuelle"].map(cat=>{const lignes=mc.depenses.filter(p=>(p.cat||"variable")===cat);
          const stot=sum(lignes,x=>x.montant); const lbl=cat==="fixe"?"Coûts fixes":cat==="variable"?"Coûts variables":"Dépenses ponctuelles (ce mois)";
          return (<div key={cat} className="mb-3">
            <div className="flex items-center justify-between gap-2 px-1 mb-1">
              <span className="text-[11px] uppercase tracking-wide text-ink-400">{lbl}{lignes.length>0?" · "+fmtE(stot)+(c.revT>0?" · "+Math.round(stot/c.revT*100)+"%":""):""}</span>
              <button onClick={()=>addDepNamed("",cat)} className="text-xs font-medium text-brand-700 hover:text-brand-800 hover:bg-brand-50 rounded-lg px-2 py-0.5 cursor-pointer">+ ajouter</button></div>
            <div className="space-y-2">{lignes.map(p=>(<div key={p.id} className="flex items-center gap-2">
              <select value={p.cat||"variable"} onChange={e=>upd("depenses",p.id,{cat:e.target.value})} className="text-xs rounded-lg border border-ink-200 py-2 px-1.5 text-ink-600 bg-white"><option value="fixe">Fixe</option><option value="variable">Variable</option><option value="ponctuelle">Ponctuelle</option></select>
              <div className="flex-1"><TextInput value={p.nom} onChange={v=>upd("depenses",p.id,{nom:v})}/></div>
              {c.revT>0&&n(p.montant)>0&&<span className="text-[11px] text-ink-400 shrink-0 w-10 text-right" title="part de tes revenus">{Math.round(n(p.montant)/c.revT*100)}%</span>}
              <Money value={p.montant} onChange={v=>upd("depenses",p.id,{montant:v})} className="w-28"/>
              <IconBtn name="x" onClick={()=>del("depenses",p.id)} title="Supprimer"/></div>))}</div>
            {lignes.length===0&&<div className="text-xs text-ink-300 px-1 pb-1">{cat==="ponctuelle"?"Une grosse dépense imprévue ce mois (réparation, gros achat) : elle compte ce mois-ci et ne sera pas reportée.":"Rien pour l'instant."}</div>}
          </div>);})}
        <div className="flex flex-wrap items-center justify-between gap-2 mt-1 pt-3 border-t border-ink-200 text-sm">
          <span className="font-heading font-semibold text-ink-700">Total {fmtE(c.depCourante)}{deltaDep!=null&&<span className={"ml-1 text-xs font-normal "+(deltaDep>0?"text-red-500":"text-brand-600")}>({deltaDep>0?"+":""}{fmtP(deltaDep)} vs {moisCourt(moisPrec)})</span>}</span>
          {c.revT>0&&<span className="text-xs font-medium text-brand-700 bg-brand-50 border border-brand-200 rounded-full px-2.5 py-0.5">{Math.round((1-c.depCourante/c.revT)*100)}% restant</span>}
        </div></Card>
    </div>
    <Card title="Dettes et crédits" sub="Un crédit a une mensualité (qui compte dans ton cashflow) ; une dette est de l'argent que tu dois (ex : un prêt d'un proche). Rattachée à un bien immobilier, une dette réduit sa plus-value latente sans toucher à ton disponible." right={<AddBtn onClick={addC}>Ajouter</AddBtn>}>
      <div className="space-y-2">
        {data.dettes.map(x=>{const t=x.type||"credit"; return(<div key={x.id} className="rounded-2xl border border-ink-100 p-2.5 space-y-2">
          <div className="flex items-center gap-2">
            <select value={t} onChange={e=>updC(x.id,{type:e.target.value})} className="text-sm rounded-xl border border-ink-200 py-2 px-2 text-ink-600 bg-white"><option value="credit">Crédit</option><option value="dette">Dette</option></select>
            <div className="flex-1 min-w-[120px]"><TextInput value={x.nom} onChange={v=>updC(x.id,{nom:v})} placeholder={t==="dette"?"Ex : prêt de Paul":"Ex : crédit auto"}/></div>
            <IconBtn name="x" onClick={()=>delC(x.id)} title="Supprimer"/>
          </div>
          {t==="credit"
            ? <div className="grid grid-cols-2 sm:grid-cols-4 gap-2">
                <Field label="Mensualité"><Money value={x.mensualite||0} onChange={v=>updC(x.id,{mensualite:v})}/></Field>
                <Field label="Capital restant"><Money value={x.montant} onChange={v=>updC(x.id,{montant:v})}/></Field>
