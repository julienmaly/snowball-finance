const n = v => { const x = parseFloat(v); return isFinite(x) ? x : 0; };
const sum = (arr, f) => (arr||[]).reduce((s,x)=>s + n(f?f(x):x), 0);
const fmtE = v => (isFinite(v)?Math.round(v):0).toLocaleString("fr-FR") + " €";
const fmtEk = v => Math.abs(v)>=1000 ? Math.round(v/1000).toLocaleString("fr-FR")+" k€" : Math.round(v)+" €";
const fmtUSD = v => (isFinite(v)?Math.round(v):0).toLocaleString("fr-FR") + " $";
const fmtP = v => (isFinite(v)?(v*100):0).toFixed(1).replace(".",",") + " %";
const fmtM = v => (isFinite(v)?v:0).toFixed(1).replace(".",",") + " mois";
const MOIS=["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];
const moisLong = ym => { if(!ym) return ""; const [y,m]=ym.split("-"); return MOIS[+m-1]+" "+y; };
const moisCourt = ym => { const [y,m]=ym.split("-"); return MOIS[+m-1].slice(0,4)+". "+y.slice(2); };
const nowYM = () => { const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0"); };

const reduceMotion = () => window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
function useCountUp(value){
  const [v,setV]=useState(value);
  useEffect(()=>{ if(reduceMotion()){ setV(value); return; }
    let raf, start; const to=value||0, dur=700;
    const tick=t=>{ if(!start)start=t; const p=Math.min(1,(t-start)/dur);
      setV(to*(1-Math.pow(1-p,3))); if(p<1) raf=requestAnimationFrame(tick); };
    raf=requestAnimationFrame(tick); return ()=>cancelAnimationFrame(raf); },[value]);
  return v;
}

/* synchro GitHub (repo privé, données récupérables partout) */
const GH_KEY="snowball-gh";
function loadGh(){ try{return JSON.parse(localStorage.getItem(GH_KEY))||{path:"snowball-data.json"};}catch(e){return {path:"snowball-data.json"};} }
const b64enc=s=>btoa(unescape(encodeURIComponent(s)));
const b64dec=s=>decodeURIComponent(escape(atob((s||"").replace(/\n/g,""))));
async function ghGet(g){
  const r=await fetch(`https://api.github.com/repos/${g.owner}/${g.repo}/contents/${g.path}`,
    {headers:{Authorization:`Bearer ${g.token}`,Accept:"application/vnd.github+json"}});
  if(r.status===404) return {sha:null,content:null};
  if(!r.ok) throw new Error("lecture ("+r.status+")");
  const j=await r.json(); return {sha:j.sha, content:b64dec(j.content)};
}
async function ghPut(g,str,sha){
  const body={message:"Sauvegarde Snowball "+new Date().toISOString().slice(0,16).replace("T"," "), content:b64enc(str)};
  if(sha) body.sha=sha;
  const r=await fetch(`https://api.github.com/repos/${g.owner}/${g.repo}/contents/${g.path}`,
    {method:"PUT",headers:{Authorization:`Bearer ${g.token}`,Accept:"application/vnd.github+json","Content-Type":"application/json"},body:JSON.stringify(body)});
  if(!r.ok){ const t=await r.text(); throw new Error("écriture ("+r.status+") "+t.slice(0,80)); }
  return true;
}

/* projection multi-années partagée */
function projeter(net, apportAnnuel, rdt, objEUR, ans){
  const out=[]; let bal=net;
  for(let i=1;i<=ans;i++){ const debut=bal; const pv=debut*rdt; bal=debut+pv+apportAnnuel; out.push({i, net:bal}); }
  const hit=out.find(o=>o.net>=objEUR);
  return { points:out, hit: hit?hit.i:null };
}

/* graphiques */
function Donut({data,size=150}){
  const total=data.reduce((s,d)=>s+d.value,0);
  if(total<=0) return <div className="text-sm text-ink-400 py-10 text-center">Aucune donnée</div>;
  let acc=0; const stops=data.map(d=>{const a=acc/total*100;acc+=d.value;return `${d.color} ${a}% ${acc/total*100}%`;}).join(", ");
  const hole=Math.round(size*0.6);
  return (<div className="flex items-center gap-5 flex-wrap">
    <div className="rounded-full shrink-0 relative" style={{width:size,height:size,background:`conic-gradient(${stops})`}}>
      <div className="rounded-full bg-white absolute inset-0 m-auto flex flex-col items-center justify-center" style={{width:hole,height:hole}}>
        <span className="text-[10px] uppercase tracking-wide text-ink-400">Total</span>
        <span className="font-heading font-bold text-ink-900 text-sm">{fmtEk(total)}</span></div></div>
    <div className="space-y-1.5 text-sm flex-1 min-w-[160px]">
      {data.map((d,i)=>(<div key={i} className="flex items-center gap-2">
        <span className="w-2.5 h-2.5 rounded-full inline-block shrink-0" style={{background:d.color}}></span>
        <span className="text-ink-600 truncate">{d.label}</span>
        <span className="ml-auto font-semibold text-ink-900">{(d.value/total*100).toFixed(0)}%</span></div>))}
    </div></div>);
}
function LineChart({series, labels, height=240, fmt=fmtEk}){
  const W=680,H=height,padL=46,padB=26,padT=12,padR=14;
  const all=series.flatMap(s=>s.points.filter(p=>p!=null)); if(!all.length) return null;
  let max=Math.max(...all), min=Math.min(0,...all); if(max===min)max=min+1;
  const nx=labels.length>1?labels.length-1:1;
  const x=i=>padL+i*(W-padL-padR)/nx;
  const y=v=>H-padB-(v-min)/(max-min)*(H-padB-padT);
  const ticks=[0,.25,.5,.75,1].map(t=>min+(max-min)*t);
  const poly=pts=>pts.map((p,i)=>p==null?null:`${x(i)},${y(p)}`).filter(Boolean).join(" ");
  return (<svg viewBox={`0 0 ${W} ${H}`} className="w-full" style={{maxHeight:H}}>
    <defs>{series.map((s,si)=>(<linearGradient key={si} id={"g"+si} x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stopColor={s.color} stopOpacity="0.22"/><stop offset="100%" stopColor={s.color} stopOpacity="0"/></linearGradient>))}</defs>
    {ticks.map((t,i)=>(<g key={i}><line x1={padL} x2={W-padR} y1={y(t)} y2={y(t)} stroke="#eef2f7"/>
      <text x={6} y={y(t)+4} fontSize="10" fill="#94a3b8">{fmt(t)}</text></g>))}
    {labels.map((l,i)=> (labels.length<=13||i%Math.ceil(labels.length/8)===0) &&
      <text key={i} x={x(i)} y={H-padB+16} fontSize="10" fill="#94a3b8" textAnchor="middle">{l}</text>)}
    {series.map((s,si)=>{ if(!s.fill) return null; const idx=s.points.map((p,i)=>p==null?-1:i).filter(i=>i>=0); if(!idx.length) return null;
      return <polygon key={si} fill={`url(#g${si})`} points={`${x(idx[0])},${y(min)} `+poly(s.points)+` ${x(idx[idx.length-1])},${y(min)}`}/>;})}
    {series.map((s,si)=>(<polyline key={si} fill="none" stroke={s.color} strokeWidth="2.5" strokeDasharray={s.dash?"6 5":""} points={poly(s.points)}/>))}
    {series.map((s,si)=>s.points.map((p,i)=> p!=null && <circle key={si+"_"+i} cx={x(i)} cy={y(p)} r="3" fill="#fff" stroke={s.color} strokeWidth="2"/>))}
  </svg>);
}
function Sparkline({points,color=BLUE,w=110,h=34}){
  if(!points||points.length<2) return null;
  const max=Math.max(...points),min=Math.min(...points),d=max-min||1;
  const pts=points.map((p,i)=>`${i*(w/(points.length-1))},${h-((p-min)/d)*(h-4)-2}`).join(" ");
  return <svg width={w} height={h}><polyline fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" points={pts}/></svg>;
}
function MiniBars({items}){
  const max=Math.max(1,...items.map(i=>Math.abs(i.value)));
  return (<div className="space-y-3">{items.map((it,i)=>(<div key={i}>
    <div className="flex justify-between text-sm mb-1"><span className="text-ink-500">{it.label}</span>
      <span className="font-semibold" style={{color:it.color}}>{fmtE(it.value)}</span></div>
    <div className="h-2.5 rounded-full bg-ink-100 overflow-hidden"><div className="h-full rounded-full transition-all" style={{width:Math.min(100,Math.abs(it.value)/max*100)+"%",background:it.color}}/></div>
  </div>))}</div>);
}

    catch(e){ flash("Échec sauvegarde : "+e.message); } setBusy(""); };
  const ghRestaurer=async()=>{ if(!ghReady){flash("Configure GitHub dans Réglages");return;} setBusy("load");

    catch(e){ flash("Échec restauration : "+e.message); } setBusy(""); };
  useEffect(()=>{ setSavedSnap(JSON.stringify(data)); const g=loadGh();
    if(g.token&&g.owner&&g.repo&&g.path){ ghGet(g).then(r=>{ if(r&&r.content){ const d=JSON.parse(r.content);
      if(d&&d.params && (!CAME_FROM_STORAGE || n(d.updatedAt)>n(data.updatedAt))){ setData(d); setSavedSnap(JSON.stringify(d)); flash("Données synchronisées depuis GitHub"); } } }).catch(()=>{}); } },[]);
  const dirty = ghReady && savedSnap && JSON.stringify(data)!==savedSnap;

  /* taux EUR/USD auto */

  useEffect(()=>{ fetchFX(); },[]);

  const c=useMemo(()=>{

    const immoCf=sum(biens.filter(b=>b.usage==="Locatif"),b=>{const occ=(12-Math.min(12,n(b.vacance)))/12; return n(b.loyer)*occ-n(b.charges)-n(b.taxe)/12-n(b.mensualite);});
    const bourse=data.bourse||[]; const bourseValeur=sum(bourse,x=>x.valeur), bourseDiv=sum(bourse,x=>x.dividendes)/12;
    const financierBrut=sum(data.patrimoine,a=>a.montant)+bourseValeur;
    const brut=financierBrut+immoValeur, dettesT=sum(data.dettes,x=>x.montant)+immoDette, net=brut-dettesT;
    const revTman=sum(mc.revenus,r=>r.montant), revPman=sum(mc.revenus.filter(r=>r.type==="passif"),r=>r.montant), revA=revTman-revPman;
    const immoPos=Math.max(0,immoCf), revP=revPman+immoPos+bourseDiv, revT=revTman+immoPos+bourseDiv;

  const histCashflow=useMemo(()=> Object.keys(data.mois).sort().map(ym=>{const mm=data.mois[ym];
    return {ym,cf:sum(mm.revenus,r=>r.montant)-sum(mm.depenses,x=>x.montant)};}),[data.mois]);

  const doExport=()=>{ const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
    const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="snowball-data.json"; a.click(); flash("Données exportées"); };
  const doImport=e=>{ const f=e.target.files[0]; if(!f)return; const r=new FileReader();

    r.readAsText(f); };

  const tabs=[["dashboard","Tableau de bord","dashboard"],["patrimoine","Patrimoine","bank"],["cashflow","Cashflow","wallet"],

/* insights */
function insights(c,data){
  const out=[]; const add=(tone,titre,txt)=>out.push({tone,titre,txt});
  if(c.pctObj>=0.9&&c.pctObj<1) add("good","Tu y es presque","Plus que "+fmtE(c.reste)+" pour atteindre ton objectif. Un trimestre de cashflow peut suffire.");
  if(c.pctObj>=1) add("good","Objectif atteint","Ton patrimoine net dépasse ton objectif. Fixe le prochain cap dans Réglages.");
  if(c.ratioFI>=1) add("good","Indépendance financière","Tes revenus passifs couvrent 100% de ton train de vie. Tu es libre financièrement.");
  else if(c.depT>0) add("info","Vers la liberté financière","Tes revenus passifs couvrent "+fmtP(c.ratioFI)+" de ton train de vie. Il te manque "+fmtE(c.depT-c.revP)+" par mois de passif pour être libre.");
  const exces=c.cash-data.params.cibleFondsMois*c.depT;
  if(c.depT>0&&c.fondsMois>data.params.cibleFondsMois+3) add("info","Du cash dort","Tu as "+fmtM(c.fondsMois)+" de réserve (cible "+data.params.cibleFondsMois+"). Environ "+fmtE(exces)+" pourraient être investis pour accélérer la boule de neige.");
  if(c.depT>0&&c.fondsMois<data.params.cibleFondsMois) add("warn","Réserve à renforcer","Ton fonds d'urgence ("+fmtM(c.fondsMois)+") est sous ta cible de "+data.params.cibleFondsMois+" mois.");
  const dCher=(data.dettes||[]).filter(d=>n(d.taux)>=0.07).sort((a,b)=>b.taux-a.taux)[0];
  if(dCher) add("warn","Dette coûteuse","« "+dCher.nom+" » coûte "+fmtP(dCher.taux)+" par an. La rembourser équivaut à un rendement garanti supérieur à la plupart des placements.");
  if(c.revT>0&&c.tauxEpargne>=0.5) add("good","Excellent taux d'épargne","Tu épargnes "+fmtP(c.tauxEpargne)+" de tes revenus, soit "+fmtE(c.cashflow*12)+" par an à réinvestir.");
  else if(c.revT>0&&c.tauxEpargne<0.2) add("warn","Taux d'épargne faible","Tu n'épargnes que "+fmtP(c.tauxEpargne)+". Vise au moins 20% en revoyant tes plus grosses dépenses.");
  if(c.pvLatente>0) add("info","Plus-value latente","Tu portes "+fmtE(c.pvLatente)+" de plus-value latente sur tes actifs. Elle se concrétisera à la revente.");
  if(!out.length) add("info","Commence à remplir","Renseigne ton patrimoine et ton cashflow pour obtenir des recommandations personnalisées.");
  return out;
}

/* Guide de démarrage */
function GuideDemarrage({data,ghReady,go,openAssistant}){
  const mc=data.mois[data.moisActif]||{revenus:[],depenses:[]};
  const ess=[
    {fait:(data.patrimoine||[]).some(a=>n(a.montant)>0), label:"Renseigne ton patrimoine", hint:"Comptes, placements, liquidités", tab:"patrimoine"},
    {fait:(mc.revenus||[]).some(r=>n(r.montant)>0), label:"Saisis tes revenus du mois", hint:"Salaire, revenus passifs", tab:"cashflow"},
    {fait:(mc.depenses||[]).some(p=>n(p.montant)>0), label:"Saisis tes dépenses du mois", hint:"Loyer, courses, factures", tab:"cashflow"},
    {fait:n(data.params.objectifEUR)>0, label:"Fixe ton objectif", hint:"Le patrimoine net visé (Réglages)", tab:"reglages"},
    {fait:!!ghReady, label:"Active la sauvegarde GitHub", hint:"Pour ne jamais perdre tes données", tab:"reglages"},
  ];
  const opt=[
    {fait:(data.dettes||[]).length>0, label:"Renseigne tes crédits", hint:"Mensualité et capital restant (Cashflow)", tab:"cashflow"},
    {fait:(data.biens||[]).length>0, label:"Ajoute tes biens immobiliers", hint:"Patrimoine, sous-onglet Immobilier", tab:"patrimoine"},
    {fait:(data.bourse||[]).length>0, label:"Ajoute tes investissements", hint:"Bourse, PE, crypto, PER (Patrimoine > Investissements)", tab:"patrimoine"},
    {fait:(data.suivi||[]).some(r=>n(r.brut)>0), label:"Renseigne ton historique", hint:"Tes années passées (Suivi)", tab:"suivi"},
    {fait:(data.jalons||[]).some(j=>j.statut==="Fait"||j.statut==="En cours"), label:"Fixe-toi des objectifs", hint:"Tes objectifs de progression", tab:"objectifs"},
  ];
  const done=ess.filter(s=>s.fait).length, total=ess.length;
  const [open,setOpen]=useState(done<total);
  const Row=({s})=>(<button onClick={()=>go(s.tab)} className="w-full flex items-center gap-3 text-left rounded-xl p-2.5 hover:bg-ink-100 transition cursor-pointer">
    <span className={"w-6 h-6 rounded-lg flex items-center justify-center shrink-0 "+(s.fait?"bg-brand-500 text-white":"border-2 border-ink-200 text-transparent")}><Icon name="check" className="w-4 h-4" stroke={3}/></span>

    {!s.fait&&<span className="text-xs text-brand-700 font-medium shrink-0">Aller</span>}</button>);
  return (<div className="card panel rounded-3xl overflow-hidden">
    <div className="p-5 sm:p-6 text-white relative overflow-hidden" style={{background:"linear-gradient(135deg,#38bdf8,#0369a1)"}}>
      <div className="absolute -right-6 -bottom-10 opacity-15"><Snowflake className="w-36 h-36"/></div>
      <div className="flex flex-wrap items-center justify-between gap-4 relative">
        <div className="min-w-[220px]"><h3 className="font-heading text-xl font-bold flex items-center gap-2"><Icon name="check" className="w-5 h-5"/>Bien démarrer</h3>
          <p className="text-brand-50 text-sm mt-1">Remplis ou mets à jour tout, étape par étape, avec l'assistant. Ou suis la liste ci-dessous.</p></div>
        <button onClick={openAssistant} className="bg-white text-brand-700 font-semibold px-6 py-3 rounded-xl shadow hover:bg-brand-50 cursor-pointer whitespace-nowrap">Démarrer l'assistant</button>
      </div>
    </div>
    <div className="p-5 sm:p-6">
      <div className="flex items-center justify-between gap-3 cursor-pointer" onClick={()=>setOpen(!open)}>
        <div><h4 className="font-heading font-semibold text-ink-900">Par où commencer</h4>
          <p className="text-xs text-ink-500 mt-0.5">{done===total?"L'essentiel est rempli. Continue d'alimenter chaque mois.":"Suis ces étapes pour bien démarrer ("+done+"/"+total+")."}</p></div>
        <div className="flex items-center gap-3"><div className="w-24 h-2 rounded-full bg-ink-100 overflow-hidden hidden sm:block"><div className="h-full bg-gradient-to-r from-brand-400 to-brand-600 transition-all" style={{width:(done/total*100)+"%"}}/></div><span className="text-ink-400">{open?"▾":"▸"}</span></div>
      </div>
      {open&&<div className="mt-3 grid md:grid-cols-2 gap-x-4 gap-y-1">
        <div><div className="text-xs uppercase tracking-wide text-ink-400 px-2.5 mb-1">Essentiel</div>{ess.map((s,i)=><Row key={i} s={s}/>)}</div>
        <div><div className="text-xs uppercase tracking-wide text-ink-400 px-2.5 mb-1 mt-3 md:mt-0">Si ça te concerne</div>{opt.map((s,i)=><Row key={i} s={s}/>)}</div>
      </div>}
    </div>
  </div>);
}

/* Suivi mensuel récurrent */
function SuiviMensuel({data,setData,go,ghMaj}){
  const ym=nowYM();
  const r=(data.routine&&data.routine[ym])||{};
  const toggle=k=>setData(d=>{const ro={...(d.routine||{})}; const cur={...(ro[ym]||{})}; cur[k]=!cur[k]; ro[ym]=cur; return {...d,routine:ro};});
  const savedThisMonth=(ghMaj||"").slice(0,7)===ym;
  const items=[
    {k:"cashflow",fait:!!r.cashflow,label:"Mettre à jour mes revenus et dépenses",tab:"cashflow"},
    {k:"patrimoine",fait:!!r.patrimoine,label:"Actualiser la valeur de mon patrimoine",tab:"patrimoine"},
    {k:"credits",fait:!!r.credits,label:"Vérifier mes crédits (capital restant)",tab:"cashflow"},
    {k:"actifs",fait:!!r.actifs,label:"Actualiser immobilier et investissements",tab:"patrimoine"},
    {k:"save",fait:savedThisMonth||!!r.save,label:"Sauvegarder sur GitHub",tab:"reglages",auto:savedThisMonth},
  ];
  const done=items.filter(i=>i.fait).length, total=items.length;
  const [open,setOpen]=useState(done<total);
  return (<div className="card panel rounded-3xl p-5 sm:p-6">
    <div className="flex items-center justify-between gap-3 cursor-pointer" onClick={()=>setOpen(!open)}>
      <div className="flex items-center gap-2"><Icon name="trending" className="w-5 h-5 text-brand-600"/>
        <div><h3 className="font-heading font-semibold text-ink-900">Mise à jour de {moisLong(ym)}</h3>
        <p className="text-xs text-ink-500 mt-0.5">{done===total?"Tout est à jour pour ce mois. Reviens le mois prochain.":"Ce qu'il reste à actualiser ce mois ("+done+"/"+total+")."}</p></div></div>
      <div className="flex items-center gap-3"><div className="w-24 h-2 rounded-full bg-ink-100 overflow-hidden hidden sm:block"><div className="h-full bg-gradient-to-r from-brand-400 to-brand-600 transition-all" style={{width:(done/total*100)+"%"}}/></div><span className="text-ink-400">{open?"▾":"▸"}</span></div>
    </div>
    {open&&<div className="mt-3 space-y-1">{items.map(it=>(<div key={it.k} className="flex items-center gap-3 rounded-xl p-2.5 hover:bg-ink-100 transition">
      <button onClick={()=>!it.auto&&toggle(it.k)} disabled={it.auto} className={"w-6 h-6 rounded-lg flex items-center justify-center shrink-0 transition "+(it.fait?"bg-brand-500 text-white":"border-2 border-ink-200 text-transparent hover:border-brand-400")+(it.auto?"":" cursor-pointer")}><Icon name="check" className="w-4 h-4" stroke={3}/></button>
      <span className={"flex-1 text-sm font-medium "+(it.fait?"text-ink-400 line-through":"text-ink-900")}>{it.label}{it.auto&&it.fait?" (fait)":""}</span>
      <button onClick={()=>go(it.tab)} className="text-xs text-brand-700 font-medium hover:underline cursor-pointer shrink-0">Aller</button></div>))}
      <p className="text-xs text-ink-400 px-2.5 pt-1">Coche au fur et à mesure. Le mois prochain, cette liste se réinitialise automatiquement.</p></div>}
  </div>);
}

/* Patrimoine */
function AssistantGuide({data,setData,onClose}){
  const [e,setE]=useState(0);

  const addUsage=u=>setData(d=>({...d,biens:[...(d.biens||[]),{id:uid(),usage:u,nom:u==="MDB"?"Opération":"Bien",prixAchat:0,fraisAcq:0,travaux:0,valeur:0,loyer:0,charges:0,taxe:0,vacance:0,capital:0,mensualite:0,taux:0.03,prixRevente:0,portageMois:0,dureeMois:6,fraisRevente:0,tauxIS:0.25}]}));

  const delB=id=>setData(d=>({...d,biens:(d.biens||[]).filter(b=>b.id!==id)}));
  const addBo=(nom,type)=>setData(d=>({...d,bourse:[...(d.bourse||[]),{id:uid(),nom,type,investi:0,valeur:0,dividendes:0}]}));
  const updBo=(id,p)=>setData(d=>({...d,bourse:(d.bourse||[]).map(x=>x.id===id?{...x,...p}:x)}));
  const delBo=id=>setData(d=>({...d,bourse:(d.bourse||[]).filter(x=>x.id!==id)}));
  const addCr=()=>setData(d=>({...d,dettes:[...d.dettes,{id:uid(),nom:"Crédit",montant:0,mensualite:0,taux:0.03,actifLie:""}]}));
  const updCr=(id,p)=>setData(d=>({...d,dettes:d.dettes.map(x=>x.id===id?{...x,...p}:x)}));
  const delCr=id=>setData(d=>({...d,dettes:d.dettes.filter(x=>x.id!==id)}));
  const setP=(k,v)=>setData(d=>({...d,params:{...d.params,[k]:v}}));
  const ym=data.moisActif; const mc=data.mois[ym]||{revenus:[],depenses:[]};
  const setMc=(kind,lines)=>setData(d=>({...d,mois:{...d.mois,[ym]:{...(d.mois[ym]||{revenus:[],depenses:[]}),[kind]:lines}}}));
  const addRev=(nom,type)=>setMc("revenus",[...mc.revenus,{id:uid(),nom,montant:0,type:type||"passif"}]);
  const updRev=(id,p)=>setMc("revenus",mc.revenus.map(x=>x.id===id?{...x,...p}:x));
  const delRev=id=>setMc("revenus",mc.revenus.filter(x=>x.id!==id));
  const addDep=nom=>setMc("depenses",[...mc.depenses,{id:uid(),nom,montant:0}]);
  const updDep=(id,p)=>setMc("depenses",mc.depenses.map(x=>x.id===id?{...x,...p}:x));
  const delDep=id=>setMc("depenses",mc.depenses.filter(x=>x.id!==id));
  const dejaR=new Set(mc.revenus.map(x=>(x.nom||"").toLowerCase())), dejaD=new Set(mc.depenses.map(x=>(x.nom||"").toLowerCase()));

          <div className="space-y-2">{mc.depenses.map(x=>(<div key={x.id} className="flex items-center gap-2"><div className="flex-1"><TextInput value={x.nom} onChange={v=>updDep(x.id,{nom:v})} placeholder="Dépense"/></div><Money value={x.montant} onChange={v=>updDep(x.id,{montant:v})} className="w-28"/><IconBtn name="x" onClick={()=>delDep(x.id)}/></div>))}</div></div>}
        {e===7&&<div className="space-y-3"><Field label="Mon objectif de patrimoine net (en €)"><Money value={data.params.objectifEUR} onChange={v=>setP("objectifEUR",v)}/></Field>
          <div className="rounded-2xl bg-brand-50 border border-brand-200 p-4 text-sm text-ink-700">C'est tout bon. Ton patrimoine net est de <b className="text-brand-700">{fmtE(net)}</b>. Pense à activer la sauvegarde GitHub dans Réglages pour ne rien perdre.</div></div>}
      </div>
      <div className="flex items-center justify-between mt-4 pt-4 border-t border-ink-100">
        <div className="text-sm text-ink-500">Patrimoine net : <b className="text-brand-700">{fmtE(net)}</b></div>
        <div className="flex gap-2">{e>0&&<button onClick={()=>setE(e-1)} className="px-4 py-2 rounded-xl border border-ink-200 text-ink-700 hover:bg-ink-100 text-sm cursor-pointer">Précédent</button>}
          {e<titres.length-1?<button onClick={()=>setE(e+1)} className="px-4 py-2 rounded-xl bg-brand-600 hover:bg-brand-700 text-white text-sm font-medium cursor-pointer">Suivant</button>
            :<button onClick={onClose} className="px-4 py-2 rounded-xl bg-brand-600 hover:bg-brand-700 text-white text-sm font-medium cursor-pointer">Terminer</button>}</div>
      </div>
    </div></div>);
}

  const delA=id=>setData(d=>({...d,patrimoine:d.patrimoine.filter(a=>a.id!==id)}));
  const addA=()=>setData(d=>({...d,patrimoine:[...d.patrimoine,{id:uid(),nom:"Nouvel actif",etablissement:"",pays:"",montant:0,prixRevient:0,classe:"Liquidités"}]}));
  const addAsset=(nom,classe)=>setData(d=>({...d,patrimoine:[...d.patrimoine,{id:uid(),nom,etablissement:"",pays:"",montant:0,prixRevient:0,classe}]}));
  const dejaP=new Set(data.patrimoine.map(a=>(a.nom||"").toLowerCase()));
  const detteFor=aid=>sum((data.dettes||[]).filter(x=>x.actifLie===aid),x=>x.montant);
  const finBrut=sum(data.patrimoine,a=>a.montant);
  const tips=[];
  if(c.brut>0&&c.immoValeur/c.brut>0.65) tips.push({tone:"info",titre:"Poids de l'immobilier",txt:"l'immobilier pèse "+fmtP(c.immoValeur/c.brut)+" de ton patrimoine. Des actifs plus liquides équilibreraient le risque."});
  if(c.brut>0&&c.cash/c.brut<0.05) tips.push({tone:"warn",titre:"Peu de liquidités",txt:"tes liquidités ne font que "+fmtP(c.cash/c.brut)+" du patrimoine. Garde de quoi absorber les imprévus."});
  if(c.brut>0&&c.dettesT/c.brut>0.6) tips.push({tone:"warn",titre:"Endettement élevé",txt:"tes dettes représentent "+fmtP(c.dettesT/c.brut)+" de tes actifs."});
  if(!tips.length&&c.brut>0) tips.push({tone:"good",titre:"Allocation équilibrée",txt:"continue d'alimenter régulièrement pour faire jouer la boule de neige."});
  const SUBS=[["financier","Comptes"],["immobilier","Immobilier"],["bourse","Investissements"]];
  return (<div className="space-y-5">
    <AssistantBanner onStart={openAssistant}/>
    <div className="grid grid-cols-2 sm:grid-cols-4 gap-4">
      <KPI label="Patrimoine brut" value={fmtE(c.brut)} icon="bank"/>
      <KPI label="Dettes" value={fmtE(c.dettesT)} tone="red"/>
      <KPI label="Patrimoine net" value={fmtE(c.net)} tone="blue"/>
      <KPI label="Plus-value latente" value={fmtE(c.pvLatente)} tone={c.pvLatente>=0?"blue":"red"}/></div>
    <Card title="Allocation"><Donut data={alloc}/></Card>
    <Conseils items={tips}/>
    <div className="panel rounded-2xl p-1.5 flex gap-1 w-fit">{SUBS.map(([k,l])=><button key={k} onClick={()=>setSub(k)} className={"px-4 py-2 rounded-xl text-sm font-medium cursor-pointer transition "+(sub===k?"bg-gradient-to-br from-brand-500 to-brand-700 text-white shadow":"text-ink-500 hover:bg-ink-100")}>{l}</button>)}</div>
    {sub==="financier"&&<div className="space-y-5">
      <Card title="Mes comptes et avoirs" sub="Comptes, livrets, assurance vie, espèces. Tes investissements (bourse, PE, crypto, PER) sont dans l'onglet Investissements." right={<AjouterMenu options={SUGG_PATRI.map(([label,classe])=>({label,pick:()=>addAsset(label,classe)}))} onBlank={addA}/>}>
        <div className="space-y-2">
          {data.patrimoine.map(a=>{const pv=n(a.prixRevient)>0?(n(a.montant)-n(a.prixRevient)):null; const det=detteFor(a.id); const o=open[a.id];return(
            <div key={a.id} className="rounded-2xl border border-ink-100">
              <div className="flex items-center gap-2 p-2">
                <button onClick={()=>setOpen(s=>({...s,[a.id]:!o}))} className="text-ink-300 hover:text-brand-600 w-7 h-7 rounded-lg hover:bg-ink-100 cursor-pointer shrink-0">{o?"▾":"▸"}</button>
                <div className="flex-1 min-w-[120px]"><TextInput value={a.nom} onChange={v=>updA(a.id,{nom:v})} placeholder="Ex : Livret A"/></div>
                <select value={a.classe} onChange={e=>updA(a.id,{classe:e.target.value})} className="w-32 text-sm rounded-xl border border-ink-200 py-2 px-2 text-ink-600 bg-white">{CLASSES.map(cl=><option key={cl} value={cl}>{cl}</option>)}</select>
                <Money value={a.montant} onChange={v=>updA(a.id,{montant:v})} className="w-32"/>
                <IconBtn name="x" onClick={()=>delA(a.id)}/>
              </div>
              {o&&(()=>{const isLiq=a.classe==="Liquidités"; const costLabel=a.classe==="Immobilier"?"Coût total (achat + frais + travaux)":"Montant investi";
                return(<div className="px-3 pb-3 pt-2 border-t border-ink-100 grid sm:grid-cols-2 gap-3">
                <Field label="Où c'est placé (banque, courtier)"><TextInput value={a.etablissement||""} onChange={v=>updA(a.id,{etablissement:v})} placeholder="Facultatif"/></Field>
                <Field label="Pays"><TextInput value={a.pays||""} onChange={v=>updA(a.id,{pays:v})} placeholder="Facultatif"/></Field>
                {!isLiq&&<Field label={costLabel}><Money value={a.prixRevient||0} onChange={v=>updA(a.id,{prixRevient:v})}/></Field>}
                {!isLiq&&<div className="flex flex-col justify-end text-sm pb-1">{pv!=null&&<div>Plus-value latente : <b className={pv>=0?"text-brand-700":"text-red-500"}>{fmtE(pv)}</b></div>}{pv==null&&<div className="text-xs text-ink-400">Indique le montant investi pour voir ta plus-value.</div>}</div>}
                {isLiq&&<div className="sm:col-span-2 text-xs text-ink-400">Pas de plus-value sur des liquidités, c'est du cash disponible.</div>}
              </div>);})()}
            </div>);})}
        </div>
        <div className="flex justify-between mt-3 pt-3 border-t border-ink-200 text-sm"><span className="font-heading font-semibold text-ink-700">Total financier</span><span className="font-heading font-bold text-brand-700">{fmtE(finBrut)}</span></div>
      </Card>
      <Card title="Mes crédits"><div className="flex items-center justify-between"><div className="text-sm text-ink-600">Capital restant dû, déduit de ton patrimoine net.</div><div className="font-heading font-bold text-red-500">{fmtE(c.dettesT)}</div></div>
        <p className="text-xs text-ink-400 mt-2">Les crédits se gèrent dans l'onglet <b>Cashflow</b> (mensualités = dépenses) ou via l'assistant guidé.</p></Card>
    </div>}
    {sub==="immobilier"&&<Immobilier data={data} setData={setData}/>}
    {sub==="bourse"&&<Bourse data={data} setData={setData}/>}
  </div>);
}

/* Immobilier (3 modes : RP / Locatif / MDB) */
const IMMO_MODES=[["RP","Résidence principale"],["Locatif","Locatif"],["MDB","Achat / revente"]];
function coutRevient(b){ return n(b.prixAchat)+n(b.fraisAcq)+n(b.travaux); }
function Acquisition({b,upd}){
  return (<div className="grid sm:grid-cols-3 gap-3">
    <Field label="Prix d'achat (net vendeur)"><Money value={b.prixAchat} onChange={v=>upd(b.id,{prixAchat:v})}/></Field>
    <Field label="Frais d'acquisition (notaire, agence)"><Money value={b.fraisAcq} onChange={v=>upd(b.id,{fraisAcq:v})}/></Field>
    <Field label="Travaux (cumul, à mettre à jour)"><Money value={b.travaux} onChange={v=>upd(b.id,{travaux:v})}/></Field>
  </div>);
}
function Immobilier({data,setData}){
  const [mode,setMode]=useState("RP");
  const [open,setOpen]=useState({});
  const biens=data.biens||[];
  const list=biens.filter(b=>(b.usage||"RP")===mode);
  const upd=(id,p)=>setData(d=>({...d,biens:(d.biens||[]).map(b=>b.id===id?{...b,...p}:b)}));
  const del=id=>setData(d=>({...d,biens:(d.biens||[]).filter(b=>b.id!==id)}));
  const add=()=>setData(d=>({...d,biens:[...(d.biens||[]),{id:uid(),usage:mode,nom:"Nouveau bien",prixAchat:0,fraisAcq:0,travaux:0,valeur:0,loyer:0,charges:0,taxe:0,vacance:0,capital:0,mensualite:0,taux:0.03,prixRevente:0,portageMois:0,dureeMois:6,fraisRevente:0,tauxIS:0.25}]}));
  const addUsage=u=>{ setMode(u); setData(d=>({...d,biens:[...(d.biens||[]),{id:uid(),usage:u,nom:u==="MDB"?"Nouvelle opération":"Nouveau bien",prixAchat:0,fraisAcq:0,travaux:0,valeur:0,loyer:0,charges:0,taxe:0,vacance:0,capital:0,mensualite:0,taux:0.03,prixRevente:0,portageMois:0,dureeMois:6,fraisRevente:0,tauxIS:0.25}]})); };
  const mc=data.mois[data.moisActif]||{depenses:[]};
  const logementMois=sum(mc.depenses.filter(p=>groupeOf(p.nom)==="Logement"),x=>x.montant);

  const calcLoc=b=>{const occ=(12-Math.min(12,n(b.vacance)))/12, cr=coutRevient(b), loyerAn=n(b.loyer)*12*occ;
    return {cr, occ, pv:n(b.valeur)-cr, equity:n(b.valeur)-n(b.capital),
      rdtBrut:cr>0?loyerAn/cr:0, rdtNet:cr>0?(loyerAn-n(b.charges)*12-n(b.taxe))/cr:0,
      cfMois:n(b.loyer)*occ-n(b.charges)-n(b.taxe)/12-n(b.mensualite)};};
  const calcMdb=b=>{const portage=n(b.portageMois)*n(b.dureeMois), coutTot=n(b.prixAchat)+n(b.fraisAcq)+n(b.travaux)+portage+n(b.fraisRevente);
    const margeBrute=n(b.prixRevente)-n(b.prixAchat)-n(b.fraisAcq)-n(b.travaux), margeNet=n(b.prixRevente)-coutTot, is=Math.max(0,margeNet*n(b.tauxIS)), net=margeNet-is;
    return {portage,coutTot,margeBrute,margeNet,is,net, roi:coutTot>0?net/coutTot:0, roiAn:n(b.dureeMois)>0?(coutTot>0?net/coutTot:0)*12/n(b.dureeMois):0};};

  let kpis=[];
  if(mode==="RP"){ const t=list.reduce((s,b)=>{s.val+=n(b.valeur);s.cr+=coutRevient(b);s.cap+=n(b.capital);return s;},{val:0,cr:0,cap:0});
    kpis=[["Valeur des biens",fmtE(t.val),"home","blue"],["Coût de revient",fmtE(t.cr),null,"ink"],["Plus-value latente",fmtE(t.val-t.cr),null,(t.val-t.cr)>=0?"blue":"red"],["Valeur nette",fmtE(t.val-t.cap),null,"blue"]]; }
  else if(mode==="Locatif"){ const t=list.reduce((s,b)=>{const c=calcLoc(b);s.val+=n(b.valeur);s.cf+=c.cfMois;s.pv+=c.pv;s.loyerAn+=n(b.loyer)*12*c.occ;s.net+=(n(b.loyer)*12*c.occ-n(b.charges)*12-n(b.taxe));s.cr+=c.cr;return s;},{val:0,cf:0,pv:0,loyerAn:0,net:0,cr:0});
    kpis=[["Valeur des biens",fmtE(t.val),"home","blue"],["Cashflow locatif",fmtE(t.cf)+" / mois",null,t.cf>=0?"blue":"red"],["Rendement net moyen",fmtP(t.cr>0?t.net/t.cr:0),null,"blue"],["Plus-value latente",fmtE(t.pv),null,t.pv>=0?"blue":"red"]]; }
  else { const t=list.reduce((s,b)=>{const c=calcMdb(b);s.eng+=n(b.prixAchat)+n(b.fraisAcq)+n(b.travaux);s.rev+=n(b.prixRevente);s.net+=c.net;return s;},{eng:0,rev:0,net:0});
    kpis=[["Capital engagé",fmtE(t.eng),null,"ink"],["Revente estimée",fmtE(t.rev),null,"blue"],["Marge nette estimée",fmtE(t.net),null,t.net>=0?"blue":"red"],["Opérations",list.length,null,"ink"]]; }

  const tips=[];
  if(mode==="Locatif") list.forEach(b=>{const cc=calcLoc(b); if(coutRevient(b)>0){ if(cc.cfMois<0) tips.push({tone:"warn",titre:b.nom,txt:"cashflow négatif de "+fmtE(-cc.cfMois)+" par mois. Vérifie loyer, charges ou financement."}); else if(cc.rdtNet<0.03) tips.push({tone:"info",titre:b.nom,txt:"rendement net faible ("+fmtP(cc.rdtNet)+"). Sous 3%, l'effet de levier rapporte peu."}); }});
  if(mode==="MDB") list.forEach(b=>{const cc=calcMdb(b); if(n(b.prixRevente)>0&&cc.net<0) tips.push({tone:"warn",titre:b.nom,txt:"marge nette négative. Revois prix de revente, travaux ou durée de portage."}); else if(cc.roiAn>0&&cc.roiAn<0.1) tips.push({tone:"info",titre:b.nom,txt:"rentabilité annualisée modeste ("+fmtP(cc.roiAn)+")."});});
  if(mode==="RP") list.forEach(b=>{const pv=n(b.valeur)-coutRevient(b); if(pv>0) tips.push({tone:"good",titre:b.nom,txt:"plus-value latente de "+fmtE(pv)+", exonérée à la revente."});});

  return (<div className="space-y-5">
    <div className="panel rounded-2xl p-1.5 flex gap-1 w-fit">
      {IMMO_MODES.map(([k,l])=><button key={k} onClick={()=>setMode(k)} className={"px-4 py-2 rounded-xl text-sm font-medium cursor-pointer transition "+(mode===k?"bg-gradient-to-br from-brand-500 to-brand-700 text-white shadow":"text-ink-500 hover:bg-ink-100")}>{l}</button>)}
    </div>
    <div className="grid grid-cols-2 sm:grid-cols-4 gap-4">
      {kpis.map((k,i)=><KPI key={i} label={k[0]} value={k[1]} icon={k[2]} tone={k[3]}/>)}
    </div>

    <Card title={mode==="RP"?"Ma résidence principale":mode==="Locatif"?"Mes biens locatifs":"Mes opérations d'achat / revente"}
      sub={mode==="RP"?"Le logement où tu vis. On suit sa valeur, pas un rendement.":mode==="Locatif"?"Biens loués. Rendement, cashflow et fiscalité.":"Achat, rénovation, revente. On pilote la marge de l'opération."}
      right={<AddBtn onClick={add}>Ajouter</AddBtn>}>
      {list.length===0&&<div className="text-sm text-ink-400 py-4 text-center">Aucun bien ici. Ajoute le tien.</div>}
      <div className="space-y-3">{list.map(b=>{const o=open[b.id]; return(
        <div key={b.id} className="rounded-2xl border border-ink-100">
          <div className="flex items-center gap-2 p-2">
            <button onClick={()=>setOpen(s=>({...s,[b.id]:!o}))} className="text-ink-300 hover:text-brand-600 w-7 h-7 rounded-lg hover:bg-ink-100 cursor-pointer shrink-0">{o?"▾":"▸"}</button>
            <div className="flex-1 min-w-[120px]"><TextInput value={b.nom} onChange={v=>upd(b.id,{nom:v})} placeholder={mode==="MDB"?"Ex : maison à rénover":"Ex : appartement Lyon"}/></div>
            <Money value={mode==="MDB"?b.prixRevente:b.valeur} onChange={v=>upd(b.id,mode==="MDB"?{prixRevente:v}:{valeur:v})} className="w-32"/>
            <IconBtn name="x" onClick={()=>del(b.id)} title="Supprimer"/>
          </div>
          {o&&<div className="px-3 pb-3 pt-2 border-t border-ink-100 space-y-4">
            <div className="flex flex-wrap items-center gap-2 text-sm"><span className="text-ink-500">Type :</span>
              <select value={b.usage} onChange={e=>upd(b.id,{usage:e.target.value})} className="text-sm rounded-xl border border-ink-200 py-1.5 px-2 text-ink-600 bg-white">{IMMO_MODES.map(([k,l])=><option key={k} value={k}>{l}</option>)}</select>
              <span className="text-ink-400 text-xs">changer le mode déplace ce bien (l'achat, les frais et les travaux sont conservés)</span></div>
            <Acquisition b={b} upd={upd}/>
            {mode==="RP"&&<>
              <div className="grid sm:grid-cols-3 gap-3">
                <Field label="Valeur actuelle (estimation)"><Money value={b.valeur} onChange={v=>upd(b.id,{valeur:v})}/></Field>
                <Field label="Crédit : capital restant dû"><Money value={b.capital} onChange={v=>upd(b.id,{capital:v})}/></Field>
              </div>
              <div className="grid grid-cols-2 sm:grid-cols-4 gap-3">
                <Mini label="Coût de revient" v={fmtE(coutRevient(b))}/>
                <Mini label="Plus-value latente" v={fmtE(n(b.valeur)-coutRevient(b))} tone={(n(b.valeur)-coutRevient(b))>=0?"brand":"red"}/>
                <Mini label="Valeur nette" v={fmtE(n(b.valeur)-n(b.capital))}/>
                <Mini label="Charges du logement" v={fmtE(logementMois)+" / mois"}/>
              </div>
              <p className="text-xs text-ink-400">Les charges récurrentes (électricité, eau, copro, crédit) de ta résidence principale sont suivies dans <b>Cashflow, poste Logement</b> ({fmtE(logementMois)}/mois) et ne sont pas recomptées ici. La plus-value de revente d'une résidence principale est exonérée d'impôt.</p>
            </>}
            {mode==="Locatif"&&(()=>{const c=calcLoc(b);return(<>
              <div className="grid sm:grid-cols-3 gap-3">
                <Field label="Valeur actuelle (estimation)"><Money value={b.valeur} onChange={v=>upd(b.id,{valeur:v})}/></Field>
                <Field label="Loyer perçu hors charges (mensuel)"><Money value={b.loyer} onChange={v=>upd(b.id,{loyer:v})}/></Field>
                <Field label="Charges non récupérables (mensuel)"><Money value={b.charges} onChange={v=>upd(b.id,{charges:v})}/></Field>
                <Field label="Taxe foncière (annuelle)"><Money value={b.taxe} onChange={v=>upd(b.id,{taxe:v})}/></Field>
                <Field label="Vacance (mois / an)"><Money value={b.vacance} onChange={v=>upd(b.id,{vacance:v})} suffix="m"/></Field>
                <Field label="Crédit : mensualité"><Money value={b.mensualite} onChange={v=>upd(b.id,{mensualite:v})}/></Field>
                <Field label="Crédit : capital restant dû"><Money value={b.capital} onChange={v=>upd(b.id,{capital:v})}/></Field>
              </div>
              <div className="grid grid-cols-2 sm:grid-cols-5 gap-3">
                <Mini label="Cashflow / mois" v={fmtE(c.cfMois)} tone={c.cfMois>=0?"brand":"red"}/>
                <Mini label="Rendement brut" v={fmtP(c.rdtBrut)}/>
                <Mini label="Rendement net" v={fmtP(c.rdtNet)}/>
                <Mini label="Plus-value latente" v={fmtE(c.pv)} tone={c.pv>=0?"brand":"red"}/>
                <Mini label="Valeur nette" v={fmtE(c.equity)}/>
              </div>
            </>);})()}
            {mode==="MDB"&&(()=>{const c=calcMdb(b);return(<>
              <div className="grid sm:grid-cols-3 gap-3">
                <Field label="Prix de revente estimé"><Money value={b.prixRevente} onChange={v=>upd(b.id,{prixRevente:v})}/></Field>
                <Field label="Frais de portage (mensuel : intérêts, charges)"><Money value={b.portageMois} onChange={v=>upd(b.id,{portageMois:v})}/></Field>

            </>);})()}

/* Outils : calculateur d'opération marchand de biens */
function bilanMdb(m, caMult, travMult){
  m=m||{}; caMult=caMult||1; travMult=travMult||1;
  const tva=n(m.tauxTVA)||0.2;
  const regime=(m.regimeOverride&&m.regimeOverride!=="auto")?m.regimeOverride:(m.bienNeuf?"total":(m.achatTaxe?"exoneration":"marge"));
  const recup=regime==="total";
  const fraisAcq=n(m.prixAchat)*n(m.fraisAcqPct);
  const foncier=n(m.prixAchat)+n(m.indemniteEviction)+fraisAcq+n(m.apporteur);
  const travauxBrut=(n(m.vrd)+n(m.grosOeuvre)+n(m.travauxNeufs)+n(m.equipement)+n(m.honoTech)+n(m.raccordements))*travMult;
  const aleas=travauxBrut*n(m.aleasPct);
  const techniqueHT=travauxBrut+aleas;
  const honoDivers=n(m.honoGestion)+n(m.honoCompta)+n(m.honoJustice);
  const diversHorsTVA=travauxBrut*(n(m.doPct)+n(m.gfaPct));
  const CA=sum(m.lots||[],l=>l.prix)*caMult;
  const honoVente=CA*n(m.honoVentePct);
  const fraisFin=n(m.emprunt)*n(m.tauxEmprunt)*(n(m.dureeMois)/12)+n(m.fraisDossier);
  const coef=recup?1:(1+tva);
  const coutTechnique=techniqueHT*coef, coutHonoDivers=honoDivers*coef;
  const coutHonoVente=recup?honoVente/(1+tva):honoVente;
  const caRef=recup?CA/(1+tva):CA;
  const margeTTC=CA-foncier;
  const tvaMarge=regime==="marge"?Math.max(0,margeTTC)*tva/(1+tva):0;
  const coutTotal=foncier+coutTechnique+coutHonoDivers+diversHorsTVA+fraisFin+coutHonoVente+tvaMarge;
  const resultat=caRef-coutTotal;
  const is=resultat<=0?0:(m.isReduit?0.15*Math.min(resultat,42500)+0.25*Math.max(0,resultat-42500):0.25*resultat);
  const net=resultat-is;
  return {regime,recup,fraisAcq,foncier,travauxBrut,aleas,techniqueHT,coutTechnique,honoDivers,coutHonoDivers,coutHonoVente,caRef,diversHorsTVA,CA,honoVente,fraisFin,margeTTC,tvaMarge,coutRevient:foncier+coutTechnique+coutHonoDivers+diversHorsTVA,coutTotal,resultat,is,net,
    margeCA:CA?net/CA:0, roe:n(m.apport)?net/n(m.apport):null, rentAn:(n(m.apport)&&n(m.dureeMois))?(net/n(m.apport))*12/n(m.dureeMois):null};
}

/* Outils : simulateur de rentabilité locative (façon Horiz) */
function mensualite(capital,tauxAnnuel,annees){
  const N=Math.round(annees*12); if(N<=0)return 0; const t=tauxAnnuel/12;
  if(!t) return capital/N;
  return capital*t/(1-Math.pow(1+t,-N));
}
function bilanLocatif(m){
  m=m||{};
  const prix=n(m.prix),travaux=n(m.travaux),agence=n(m.fraisAgence),mobilier=n(m.mobilier);
  const notaire=prix*n(m.notairePct);
  const coutTotal=prix+notaire+travaux+agence+mobilier;
  const loyerAn=n(m.loyerMensuel)*12, vac=n(m.vacancePct), loyerEff=loyerAn*(1-vac);
  const gestion=loyerAn*n(m.gestionPct), gli=loyerAn*n(m.gliPct);
  const charges=n(m.taxeFonciere)+n(m.coproAn)+n(m.assurancePNO)+gestion+gli+n(m.comptaAn);
  const emprunt=n(m.emprunt), mCredit=mensualite(emprunt,n(m.tauxEmprunt),n(m.dureeAnnees));
  const mAssur=emprunt*n(m.assEmprunteurPct)/12, mensualiteTot=mCredit+mAssur;
  const interets1=emprunt*n(m.tauxEmprunt), capital1=Math.max(0,mCredit*12-interets1);
  const amortBien=(prix*0.85+travaux)/30, amortMob=mobilier/8, amort=amortBien+amortMob;
  const tmi=n(m.tmi), ps=0.172, reg=m.regime||"microfoncier";
  let base=0, deficit=0;
  if(reg==="microfoncier") base=loyerEff*0.7;
  else if(reg==="microbic") base=loyerEff*0.5;
  else if(reg==="reelfoncier") base=loyerEff-charges-interets1-mAssur*12;
  else base=loyerEff-charges-interets1-mAssur*12-amort;
  let impot=0;
  if(base>0) impot=base*(tmi+ps); else { deficit=-base; }
  const cashflowAn=loyerEff-charges-mensualiteTot*12-impot, cashflowMois=cashflowAn/12;
  const enrichMois=cashflowMois+capital1/12;
  const brut=coutTotal?loyerAn/coutTotal:0, net=coutTotal?(loyerEff-charges)/coutTotal:0, netnet=coutTotal?(loyerEff-charges-impot)/coutTotal:0;
  const apport=n(m.apport), cashOnCash=apport?cashflowAn/apport:null;
  return {prix,notaire,travaux,agence,mobilier,coutTotal,loyerAn,loyerEff,vac,gestion,gli,charges,emprunt,mCredit,mAssur,mensualiteTot,interets1,capital1,amort,amortBien,amortMob,base,impot,deficit,regime:reg,tmi,cashflowAn,cashflowMois,enrichMois,brut,net,netnet,cashOnCash,apport};
}

/* Projection */
function Projection({data,setData,c}){
  const pr=data.projection;
  const annee=pr.annee||(new Date().getFullYear()+1);
  const rdt=pr.rendement!=null?pr.rendement:0.08;
  const mensuel=(pr.mensuel&&pr.mensuel.length===12)?pr.mensuel:Array.from({length:12},()=>({rev:0,dep:0}));
  const setPr=p=>setData(d=>({...d,projection:{...pr,annee,rendement:rdt,mensuel,...p}}));
  const setM=(i,k,v)=>setPr({mensuel:mensuel.map((x,j)=>j===i?{...x,[k]:v}:x)});
  const prefill=()=>setPr({mensuel:mensuel.map(()=>({rev:Math.round(c.revT),dep:Math.round(c.depT)}))});
  const totRev=sum(mensuel,x=>x.rev), totDep=sum(mensuel,x=>x.dep), totCF=totRev-totDep;
  const start=c.net, plusValue=start*rdt, netFin=start+totCF+plusValue;
  const cum=[]; let acc=start; mensuel.forEach(x=>{acc+=n(x.rev)-n(x.dep); cum.push(acc);});
  const presets=[["Prudent",0.04],["Base",0.08],["Ambitieux",0.15]];
  const scen=[["Prudent",0.04,"#94a3b8"],["Base",0.08,"#0284c7"],["Ambitieux",0.15,"#38bdf8"]];
  const trajs=scen.map(([nom,r,col])=>({nom,col,...projeter(start,totCF,r,c.objEUR,15)}));
  const hitAnnee=trajs[1].hit?annee-1+trajs[1].hit:null;
  const tips=[];
  if(totCF<=0) tips.push({tone:"warn",titre:"Pas d'épargne planifiée",txt:"ton plan ne dégage pas d'apport. Sans épargne réinvestie, seul le rendement fait grossir le capital."});
  else if(hitAnnee) tips.push({tone:"good",titre:"Objectif atteignable",txt:"au rythme « Base » (8%), tu atteins ton objectif en "+hitAnnee+". Augmenter l'apport ou le rendement le rapproche encore."});
  else tips.push({tone:"info",titre:"Objectif lointain",txt:"avec ces hypothèses, l'objectif n'est pas atteint sous 15 ans. Augmente l'apport mensuel ou vise un meilleur rendement."});
  return (<div className="space-y-5">
    <Card title={"Plan mensuel "+annee} sub="Prévois revenus et dépenses mois par mois pour l'année prochaine. C'est un budget prévisionnel, indépendant du Cashflow réel.">
      <div className="flex flex-wrap items-center gap-3 mb-4">
        <div className="flex items-center gap-1">
          <button onClick={()=>setPr({annee:annee-1})} className="w-8 h-8 rounded-lg border border-ink-200 bg-white hover:bg-ink-100 cursor-pointer">‹</button>
          <span className="font-heading font-bold text-lg text-ink-900 w-16 text-center">{annee}</span>
          <button onClick={()=>setPr({annee:annee+1})} className="w-8 h-8 rounded-lg border border-ink-200 bg-white hover:bg-ink-100 cursor-pointer">›</button></div>
        <div className="flex items-center gap-2 text-sm"><span className="text-ink-600">Rendement attendu :</span><Pct value={rdt} onChange={v=>setPr({rendement:v})} className="w-20"/>
          <div className="flex gap-1.5">{presets.map(([l,v])=><button key={l} onClick={()=>setPr({rendement:v})} className={"text-xs px-2 py-1 rounded-lg border cursor-pointer transition "+(Math.abs(rdt-v)<0.001?"bg-brand-600 text-white border-brand-600":"border-ink-200 text-ink-600 hover:bg-ink-100")}>{l}</button>)}</div></div>
        <button onClick={prefill} className="text-sm text-brand-700 hover:underline cursor-pointer ml-auto">Préremplir depuis mon mois actuel</button>
      </div>
      <div className="overflow-x-auto"><table className="w-full text-sm">
        <thead><tr className="text-ink-400 text-left"><th className="py-2 font-medium">Mois</th><th className="font-medium">Revenus prévus</th><th className="font-medium">Dépenses prévues</th><th className="font-medium">Cashflow</th><th className="font-medium">Cumulé (net)</th></tr></thead>
        <tbody>{mensuel.map((m,i)=>{const cf=n(m.rev)-n(m.dep);return(<tr key={i} className="border-t border-ink-100">
          <td className="py-1.5 capitalize text-ink-700 font-medium w-28">{MOIS[i]}</td>
          <td className="w-40 pr-2"><Money value={m.rev} onChange={v=>setM(i,"rev",v)}/></td>
          <td className="w-40 pr-2"><Money value={m.dep} onChange={v=>setM(i,"dep",v)}/></td>
          <td className={"font-medium "+(cf>=0?"text-brand-700":"text-red-500")}>{fmtE(cf)}</td>
          <td className="font-heading font-semibold text-ink-900">{fmtEk(cum[i])}</td></tr>);})}</tbody>
        <tfoot><tr className="border-t-2 border-ink-200 font-heading font-bold"><td className="py-2">Total {annee}</td>
          <td className="text-brand-700">{fmtE(totRev)}</td><td className="text-red-500">{fmtE(totDep)}</td><td className="text-sky-600">{fmtE(totCF)}</td><td/></tr></tfoot>
      </table></div>
    </Card>
    <div className="grid sm:grid-cols-4 gap-3">
      <div className="card rounded-3xl p-4 text-white" style={{background:"linear-gradient(135deg,#38bdf8,#0369a1)"}}>
        <div className="text-brand-50 text-xs">Patrimoine net fin {annee}</div><div className="font-heading text-2xl font-bold">{fmtE(netFin)}</div>
        <div className="text-brand-100 text-xs mt-0.5">+{fmtE(netFin-start)} sur l'année</div></div>
      <Mini label={"Apports cumulés "+annee} v={fmtE(totCF)}/>
      <Mini label={"Plus-value estimée ("+fmtP(rdt)+")"} v={fmtE(plusValue)}/>
      <Mini label="Objectif atteint" v={fmtP(netFin/c.objEUR)}/>
    </div>
    <Card title="Trajectoire du patrimoine net sur l'année" sub="Évolution mois par mois selon ton plan ci-dessus">
      <LineChart labels={["déb.",...MOIS.map(m=>m.slice(0,3))]} series={[{name:"Net",color:BLUE,points:[start,...cum],fill:true}]} height={220}/>
    </Card>
    <Card title="Trajectoire vers l'objectif" sub={hitAnnee?("Au rythme « Base », objectif atteint en "+hitAnnee):"Augmente l'apport ou le rendement pour atteindre l'objectif sous 15 ans"}>
      <LineChart labels={[String(annee-1),...trajs[1].points.map(p=>String(annee-1+p.i))]}
        series={[...trajs.map(t=>({name:t.nom,color:t.col,points:[start,...t.points.map(p=>p.net)]})),
          {name:"Objectif",color:"#cbd5e1",points:[c.objEUR,...trajs[1].points.map(()=>c.objEUR)],dash:true}]} height={250}/>
      <div className="flex flex-wrap gap-4 mt-3 text-sm">
        {trajs.map((t,i)=>(<div key={i} className="flex items-center gap-2"><span className="w-3 h-3 rounded-full" style={{background:t.col}}/>
          <span className="text-ink-600">{t.nom} ({fmtP(scen[i][1])}) : objectif {t.hit?("en "+(annee-1+t.hit)):"au-delà de 15 ans"}</span></div>))}
      </div>
    </Card>
    <Conseils items={tips}/>
  </div>);
}

/* Suivi */
function Suivi({data,setData,c,hist}){
  const upd=(id,p)=>setData(d=>({...d,suivi:d.suivi.map(r=>r.id===id?{...r,...p}:r)}));
  const del=id=>setData(d=>({...d,suivi:d.suivi.filter(r=>r.id!==id)}));
  const add=()=>setData(d=>{const last=[...d.suivi].sort((a,b)=>a.annee-b.annee).slice(-1)[0];
    return {...d,suivi:[...d.suivi,{id:uid(),annee:(last?last.annee+1:new Date().getFullYear()),brut:0,dettes:0}]};});
  const rows=[...data.suivi].sort((a,b)=>a.annee-b.annee);
  const nets=rows.map(r=>n(r.brut)-n(r.dettes));
  const snaps=Object.keys(data.snapshots||{}).sort();
  const realNets=snaps.map(k=>data.snapshots[k]);
  const pr=data.projection||{}; const plan=(pr.mensuel&&pr.mensuel.length===12)?pr.mensuel:[];
  let acc=c.net; const projLabels=[],projNets=[];
  plan.forEach((m,i)=>{acc+=n(m.rev)-n(m.dep); projLabels.push(MOIS[i].slice(0,3)+". "+String(pr.annee||"").slice(2)); projNets.push(acc);});
  const npLabels=[...snaps.map(moisCourt),...projLabels]; const lastReal=realNets.length-1;
  return (<div className="space-y-5">
    <Card title="Patrimoine net" sub="Tes données réelles mois par mois (trait plein), prolongées par ton plan de l'année prochaine (pointillés)">
      {snaps.length>0? <LineChart labels={npLabels}
        series={[{name:"Réel",color:BLUE,points:[...realNets,...projNets.map(()=>null)],fill:true},
          {name:"Projeté",color:"#7dd3fc",points:[...realNets.map((v,i)=>i===lastReal?v:null),...projNets],dash:true},
          {name:"Objectif",color:"#cbd5e1",points:npLabels.map(()=>c.objEUR),dash:true}]} height={240}/>
        : <div className="text-sm text-ink-400">Le suivi se construit automatiquement au fil des mois.</div>}
    </Card>
    <Card title="Cashflow mensuel" sub="Alimenté automatiquement par tes saisies de l'onglet Cashflow">
      {hist.length? <LineChart labels={hist.map(h=>moisCourt(h.ym))} series={[{name:"Cashflow",color:"#0ea5e9",points:hist.map(h=>h.cf),fill:true}]} height={190}/>
        : <div className="text-sm text-ink-400">Saisis des mois dans Cashflow pour voir la courbe.</div>}
      {hist.length>0&&<div className="grid grid-cols-3 gap-3 mt-3">
        <Mini label="Cashflow cumulé" v={fmtE(hist.reduce((s,h)=>s+h.cf,0))}/>
        <Mini label="Moyenne par mois" v={fmtE(hist.reduce((s,h)=>s+h.cf,0)/hist.length)}/>
        <Mini label="Meilleur mois" v={fmtE(Math.max(...hist.map(h=>h.cf)))}/></div>}
    </Card>
    <Card title="Historique annuel" sub="Complète les années passées (avant l'utilisation de l'app)" right={<AddBtn onClick={add}>Année</AddBtn>}>
      {rows.length>1&&<div className="mb-4"><LineChart labels={rows.map(r=>r.annee)} series={[{name:"Net",color:"#0369a1",points:nets,fill:true}]} height={190}/></div>}
      <div className="overflow-x-auto"><table className="w-full text-sm">
        <thead><tr className="text-ink-400 text-left"><th className="py-2 font-medium">Année</th><th className="font-medium">Patrim. brut</th><th className="font-medium">Dettes</th><th className="font-medium">Patrim. net</th><th className="font-medium">Progr.</th><th/></tr></thead>
        <tbody>{rows.map((r,i)=>{const net=n(r.brut)-n(r.dettes);const prev=i>0?nets[i-1]:null;const prog=prev?((net-prev)/prev):null;
          return(<tr key={r.id} className="border-t border-ink-100">
            <td className="py-1.5 w-24"><input type="number" value={r.annee} onChange={e=>upd(r.id,{annee:parseInt(e.target.value||0)})} className="num w-20 px-2 py-1.5 rounded-lg border border-ink-200 bg-white outline-none focus:border-brand-400"/></td>
            <td className="w-40 pr-2"><Money value={r.brut} onChange={v=>upd(r.id,{brut:v})}/></td>
            <td className="w-40 pr-2"><Money value={r.dettes} onChange={v=>upd(r.id,{dettes:v})}/></td>
            <td className="font-heading font-semibold text-brand-700">{fmtE(net)}</td>
            <td className={prog===null?"text-ink-400":(prog>=0?"text-brand-600":"text-red-500")}>{prog===null?"":(prog>=0?"+":"")+fmtP(prog)}</td>
            <td><IconBtn name="x" onClick={()=>del(r.id)} title="Supprimer"/></td></tr>);})}</tbody></table></div>
    </Card>
  </div>);
}

/* Objectifs */
const STATUTS=["À faire","En cours","Fait"];
const stBadge={"Fait":"bg-brand-100 text-brand-800","En cours":"bg-amber-100 text-amber-700","À faire":"bg-ink-100 text-ink-500"};
function suggestionsObj(c,data){
  const out=[]; const norm=s=>(s||"").toLowerCase().replace(/\s/g,"");
  const has=t=>data.jalons.some(j=>norm(j.intitule).includes(norm(t)));
  if(c.depT>0 && c.fondsMois<data.params.cibleFondsMois && !has("fonds d'urgence")) out.push({texte:"Constituer "+data.params.cibleFondsMois+" mois de fonds d'urgence",categorie:"Sécurité"});
  if(c.revT>0 && c.tauxEpargne<0.2 && !has("taux d'épargne")) out.push({texte:"Atteindre 20% de taux d'épargne",categorie:"Sécurité"});
  if(c.depT>0 && c.ratioFI<1 && !has("100% du train de vie")) out.push({texte:"Couvrir 100% du train de vie en revenus passifs",categorie:"Revenus passifs"});
  const dCher=(data.dettes||[]).filter(d=>n(d.taux)>=0.07).sort((a,b)=>b.taux-a.taux)[0];
  if(dCher && !has("rembourser")) out.push({texte:"Rembourser « "+dCher.nom+" »",categorie:"Sécurité"});
  const paliers=[100000,250000,500000,1000000,2000000,5000000]; const next=paliers.find(p=>p>c.net);
  if(next && !has("net supérieur à "+next.toLocaleString("fr-FR"))) out.push({texte:"Patrimoine net supérieur à "+next.toLocaleString("fr-FR")+" €",categorie:"Patrimoine"});
  const pRP=[1000,2500,5000,10000]; const nRP=pRP.find(p=>p>c.revP);
  if(nRP && c.revP>0 && !has("passifs supérieurs à "+nRP.toLocaleString("fr-FR"))) out.push({texte:"Revenus passifs supérieurs à "+nRP.toLocaleString("fr-FR")+" € par mois",categorie:"Revenus passifs"});
  return out.slice(0,5);
}
function Objectifs({data,setData,c}){
  const upd=(id,p)=>setData(d=>({...d,jalons:d.jalons.map(j=>j.id===id?{...j,...p}:j)}));
  const del=id=>setData(d=>({...d,jalons:d.jalons.filter(j=>j.id!==id)}));
  const add=(texte,categorie)=>setData(d=>({...d,jalons:[...d.jalons,{id:uid(),intitule:texte||"Nouvel objectif",categorie:categorie||"",statut:"À faire"}]}));
  const cnt=s=>data.jalons.filter(j=>j.statut===s).length, tot=data.jalons.length||1;
  const sugg=suggestionsObj(c,data);
  return (<div className="space-y-5">
    <div className="grid grid-cols-3 gap-4">
      <KPI label="Atteints" value={cnt("Fait")} tone="blue" icon="check"/>
      <KPI label="En cours" value={cnt("En cours")} tone="amber"/>
      <KPI label="À faire" value={cnt("À faire")}/></div>
    <Card><div className="flex justify-between text-sm mb-1.5"><span className="text-ink-600">Progression globale</span><span className="font-semibold text-brand-700">{fmtP(cnt("Fait")/tot)}</span></div>
      <div className="h-2.5 rounded-full bg-ink-100 overflow-hidden"><div className="h-full bg-gradient-to-r from-brand-400 to-brand-600 rounded-full transition-all" style={{width:(cnt("Fait")/tot*100)+"%"}}/></div></Card>
    {sugg.length>0&&<Card title="Suggestions" sub="Proposées automatiquement à partir de tes chiffres. Bientôt enrichies par l'IA de pilotage.">
      <div className="space-y-2">{sugg.map((s,i)=>(<div key={i} className="flex items-center gap-3 rounded-2xl border border-sky-200 bg-sky-50 p-3">
        <span className="w-2 h-2 rounded-full bg-sky-500 shrink-0"/>
        <div className="flex-1 text-sm text-ink-700">{s.texte}</div>
        <button onClick={()=>add(s.texte,s.categorie)} className="inline-flex items-center gap-1 text-sm font-medium text-brand-700 hover:text-brand-800 hover:underline cursor-pointer shrink-0"><Icon name="plus" className="w-4 h-4"/>Ajouter</button></div>))}</div>
    </Card>}
    <Card title="Mes objectifs" right={<AddBtn onClick={()=>add()}>Ajouter</AddBtn>}>
      {data.jalons.length===0&&<div className="text-sm text-ink-400 py-4 text-center">Aucun objectif. Ajoute le tien ou pioche dans les suggestions.</div>}
      <div className="space-y-2">{data.jalons.map(j=>(<div key={j.id} className="flex items-center gap-2">
        <div className="flex-1"><TextInput value={j.intitule} onChange={v=>upd(j.id,{intitule:v})}/></div>
        <select value={j.statut} onChange={e=>upd(j.id,{statut:e.target.value})} className={"text-sm rounded-lg border-0 py-2 px-3 font-medium cursor-pointer "+stBadge[j.statut]}>{STATUTS.map(s=><option key={s} value={s}>{s}</option>)}</select>
        <IconBtn name="x" onClick={()=>del(j.id)} title="Supprimer"/></div>))}</div></Card>
  </div>);
}

        {gh.maj&&<span className="text-xs text-ink-400">Dernière sauvegarde : {gh.maj}</span>}
      </div>
      <p className="text-xs text-ink-400 mt-3">Le jeton reste sur cet appareil (jamais partagé). Crée un jeton « fine-grained » limité à ce repo, permission Contents en lecture/écriture. Sur tes autres appareils (ordi, téléphone) : renseigne les mêmes champs (compte, repo, fichier, jeton) et tes données se <b>synchronisent automatiquement</b> à l'ouverture (la version la plus récente l'emporte). Pense à « Sauvegarder » après chaque session.</p>
    </Card>
    <Card title="Sauvegarde locale (fichier)" sub="En complément : un export manuel à garder chez toi.">
      <div className="flex flex-wrap gap-3">
        <button onClick={doExport} className="inline-flex items-center gap-2 bg-white border border-ink-200 text-ink-700 hover:bg-ink-100 px-4 py-2.5 rounded-xl text-sm font-medium transition cursor-pointer"><Icon name="down" className="w-4 h-4"/>Exporter (JSON)</button>
        <button onClick={()=>fileRef.current.click()} className="inline-flex items-center gap-2 bg-white border border-ink-200 text-ink-700 hover:bg-ink-100 px-4 py-2.5 rounded-xl text-sm font-medium transition cursor-pointer"><Icon name="up" className="w-4 h-4"/>Importer (JSON)</button>
        <input ref={fileRef} type="file" accept="application/json" className="hidden" onChange={doImport}/>
      </div></Card>
  </div>);
}
function Field({label,children}){return <div><div className="text-sm text-ink-600 mb-1">{label}</div>{children}</div>;}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
