let _seq = 0;
const uid = () => "id" + (++_seq) + Math.random().toString(36).slice(2,6);
const n = v => { const x = parseFloat(v); return isFinite(x) ? x : 0; };
const sum = (arr, f) => (arr||[]).reduce((s,x)=>s + n(f?f(x):x), 0);
const fmtE = v => (isFinite(v)?Math.round(v):0).toLocaleString("fr-FR") + " €";
const fmtEk = v => Math.abs(v)>=1000 ? Math.round(v/1000).toLocaleString("fr-FR")+" k€" : Math.round(v)+" €";
const fmtUSD = v => (isFinite(v)?Math.round(v):0).toLocaleString("fr-FR") + " $";
const fmtP = v => (isFinite(v)?(v*100):0).toFixed(1).replace(".",",") + " %";
const fmtM = v => (isFinite(v)?v:0).toFixed(1).replace(".",",") + " mois";
const MOIS=["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];
const moisLong = ym => { if(!ym) return ""; const [y,m]=ym.split("-"); return MOIS[+m-1]+" "+y; };
const moisCourt = ym => { const [y,m]=ym.split("-"); return MOIS[+m-1].slice(0,4)+". "+y.slice(2); };
const nowYM = () => { const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0"); };

const reduceMotion = () => window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
function useCountUp(value){
  const [v,setV]=useState(value);
  useEffect(()=>{ if(reduceMotion()){ setV(value); return; }
    let raf, start; const to=value||0, dur=700;
    const tick=t=>{ if(!start)start=t; const p=Math.min(1,(t-start)/dur);
      setV(to*(1-Math.pow(1-p,3))); if(p<1) raf=requestAnimationFrame(tick); };
    raf=requestAnimationFrame(tick); return ()=>cancelAnimationFrame(raf); },[value]);
  return v;
}

/* synchro GitHub (repo privé, données récupérables partout) */
const GH_KEY="snowball-gh";
function loadGh(){ try{return JSON.parse(localStorage.getItem(GH_KEY))||{path:"snowball-data.json"};}catch(e){return {path:"snowball-data.json"};} }
const b64enc=s=>btoa(unescape(encodeURIComponent(s)));
const b64dec=s=>decodeURIComponent(escape(atob((s||"").replace(/\n/g,""))));
async function ghGet(g){
  const r=await fetch(`https://api.github.com/repos/${g.owner}/${g.repo}/contents/${g.path}`,
    {headers:{Authorization:`Bearer ${g.token}`,Accept:"application/vnd.github+json"}});
  if(r.status===404) return {sha:null,content:null};
  if(!r.ok) throw new Error("lecture ("+r.status+")");
  const j=await r.json(); return {sha:j.sha, content:b64dec(j.content)};
}
async function ghPut(g,str,sha){
  const body={message:"Sauvegarde Snowball "+new Date().toISOString().slice(0,16).replace("T"," "), content:b64enc(str)};
  if(sha) body.sha=sha;
  const r=await fetch(`https://api.github.com/repos/${g.owner}/${g.repo}/contents/${g.path}`,
    {method:"PUT",headers:{Authorization:`Bearer ${g.token}`,Accept:"application/vnd.github+json","Content-Type":"application/json"},body:JSON.stringify(body)});
  if(!r.ok){ const t=await r.text(); throw new Error("écriture ("+r.status+") "+t.slice(0,80)); }
  return true;
}

/* projection multi-années partagée */
function projeter(net, apportAnnuel, rdt, objEUR, ans){
  const out=[]; let bal=net;
  for(let i=1;i<=ans;i++){ const debut=bal; const pv=debut*rdt; bal=debut+pv+apportAnnuel; out.push({i, net:bal}); }
  const hit=out.find(o=>o.net>=objEUR);
  return { points:out, hit: hit?hit.i:null };
}

/* graphiques */
function Donut({data,size=150}){
  const total=data.reduce((s,d)=>s+d.value,0);
  if(total<=0) return <div className="text-sm text-ink-400 py-10 text-center">Aucune donnée</div>;
  let acc=0; const stops=data.map(d=>{const a=acc/total*100;acc+=d.value;return `${d.color} ${a}% ${acc/total*100}%`;}).join(", ");
  const hole=Math.round(size*0.6);
  return (<div className="flex items-center gap-5 flex-wrap">
    <div className="rounded-full shrink-0 relative" style={{width:size,height:size,background:`conic-gradient(${stops})`}}>
      <div className="rounded-full bg-white absolute inset-0 m-auto flex flex-col items-center justify-center" style={{width:hole,height:hole}}>
        <span className="text-[10px] uppercase tracking-wide text-ink-400">Total</span>
        <span className="font-heading font-bold text-ink-900 text-sm">{fmtEk(total)}</span></div></div>
    <div className="space-y-1.5 text-sm flex-1 min-w-[160px]">
      {data.map((d,i)=>(<div key={i} className="flex items-center gap-2">
        <span className="w-2.5 h-2.5 rounded-full inline-block shrink-0" style={{background:d.color}}></span>
        <span className="text-ink-600 truncate">{d.label}</span>
        <span className="ml-auto font-semibold text-ink-900">{(d.value/total*100).toFixed(0)}%</span></div>))}
    </div></div>);
}
function LineChart({series, labels, height=240, fmt=fmtEk}){
  const W=680,H=height,padL=46,padB=26,padT=12,padR=14;
  const all=series.flatMap(s=>s.points.filter(p=>p!=null)); if(!all.length) return null;
  let max=Math.max(...all), min=Math.min(0,...all); if(max===min)max=min+1;
  const nx=labels.length>1?labels.length-1:1;
  const x=i=>padL+i*(W-padL-padR)/nx;
  const y=v=>H-padB-(v-min)/(max-min)*(H-padB-padT);
  const ticks=[0,.25,.5,.75,1].map(t=>min+(max-min)*t);
  const poly=pts=>pts.map((p,i)=>p==null?null:`${x(i)},${y(p)}`).filter(Boolean).join(" ");
  return (<svg viewBox={`0 0 ${W} ${H}`} className="w-full" style={{maxHeight:H}}>
    <defs>{series.map((s,si)=>(<linearGradient key={si} id={"g"+si} x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stopColor={s.color} stopOpacity="0.22"/><stop offset="100%" stopColor={s.color} stopOpacity="0"/></linearGradient>))}</defs>
    {ticks.map((t,i)=>(<g key={i}><line x1={padL} x2={W-padR} y1={y(t)} y2={y(t)} stroke="#eef2f7"/>
      <text x={6} y={y(t)+4} fontSize="10" fill="#94a3b8">{fmt(t)}</text></g>))}
    {labels.map((l,i)=> (labels.length<=13||i%Math.ceil(labels.length/8)===0) &&
      <text key={i} x={x(i)} y={H-padB+16} fontSize="10" fill="#94a3b8" textAnchor="middle">{l}</text>)}
    {series.map((s,si)=>{ if(!s.fill) return null; const idx=s.points.map((p,i)=>p==null?-1:i).filter(i=>i>=0); if(!idx.length) return null;
      return <polygon key={si} fill={`url(#g${si})`} points={`${x(idx[0])},${y(min)} `+poly(s.points)+` ${x(idx[idx.length-1])},${y(min)}`}/>;})}
    {series.map((s,si)=>(<polyline key={si} fill="none" stroke={s.color} strokeWidth="2.5" strokeDasharray={s.dash?"6 5":""} points={poly(s.points)}/>))}
    {series.map((s,si)=>s.points.map((p,i)=> p!=null && <circle key={si+"_"+i} cx={x(i)} cy={y(p)} r="3" fill="#fff" stroke={s.color} strokeWidth="2"/>))}
  </svg>);
}
function Sparkline({points,color=BLUE,w=110,h=34}){
  if(!points||points.length<2) return null;
  const max=Math.max(...points),min=Math.min(...points),d=max-min||1;
  const pts=points.map((p,i)=>`${i*(w/(points.length-1))},${h-((p-min)/d)*(h-4)-2}`).join(" ");
  return <svg width={w} height={h}><polyline fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" points={pts}/></svg>;
}
function MiniBars({items}){
  const max=Math.max(1,...items.map(i=>Math.abs(i.value)));
  return (<div className="space-y-3">{items.map((it,i)=>(<div key={i}>
    <div className="flex justify-between text-sm mb-1"><span className="text-ink-500">{it.label}</span>
      <span className="font-semibold" style={{color:it.color}}>{fmtE(it.value)}</span></div>
    <div className="h-2.5 rounded-full bg-ink-100 overflow-hidden"><div className="h-full rounded-full transition-all" style={{width:Math.min(100,Math.abs(it.value)/max*100)+"%",background:it.color}}/></div>
  </div>))}</div>);
}

/* ============================ APP ============================ */
function App(){
  const [data,setData]=useState(loadData);
  const [tab,setTab]=useState("dashboard");
  const [toast,setToast]=useState("");
  const fileRef=useRef();
  useEffect(()=>{ try{localStorage.setItem(KEY,JSON.stringify(data));}catch(e){} },[data]);
  const flash=m=>{ setToast(m); setTimeout(()=>setToast(""),2200); };

  /* ouverture : mois en cours */
  useEffect(()=>{ setData(d=>{ const ym=nowYM(); if(d.mois[ym]) return {...d,moisActif:ym};
    const keys=Object.keys(d.mois).sort(); const src=d.mois[keys[keys.length-1]]||{revenus:[],depenses:[]};
    const cl=a=>(a||[]).map(x=>({...x,id:uid()}));
    return {...d,moisActif:ym,mois:{...d.mois,[ym]:{revenus:cl(src.revenus),depenses:cl(src.depenses)}}}; }); },[]);

  /* taux EUR/USD auto */
  const fetchFX=()=>fetch('https://open.er-api.com/v6/latest/EUR').then(r=>r.json()).then(j=>{
    if(j&&j.rates&&j.rates.USD){ setData(d=>({...d,params:{...d.params,eurusd:+j.rates.USD.toFixed(4),fxMaj:(j.time_last_update_utc||"").slice(0,16)}})); return true;} }).catch(()=>false);
  useEffect(()=>{ fetchFX(); },[]);

  const setParam=(k,v)=>setData(d=>({...d,params:{...d.params,[k]:v}}));
  const moisActif=data.moisActif;
  const mc=data.mois[moisActif]||{revenus:[],depenses:[]};
  const setMc=(kind,lines)=>setData(d=>({...d,mois:{...d.mois,[moisActif]:{...(d.mois[moisActif]||{revenus:[],depenses:[]}),[kind]:lines}}}));

  const c=useMemo(()=>{
    const brut=sum(data.patrimoine,a=>a.montant), dettesT=sum(data.dettes,x=>x.montant), net=brut-dettesT;
    const revT=sum(mc.revenus,r=>r.montant), revP=sum(mc.revenus.filter(r=>r.type==="passif"),r=>r.montant), revA=revT-revP;
    const depCourante=sum(mc.depenses,x=>x.montant), mensuCredits=sum(data.dettes,x=>x.mensualite);
    const depT=depCourante+mensuCredits, cash=sum(data.patrimoine.filter(a=>a.classe==="Liquidités"),a=>a.montant);
    const cashflow=revT-depT, eur=data.params.eurusd||1.08, objEUR=data.params.objectifEUR||1000000;
    const pvLatente=sum(data.patrimoine.filter(a=>n(a.prixRevient)>0&&a.classe!=="Liquidités"), a=>n(a.montant)-n(a.prixRevient));
    return { brut,dettesT,net,netUSD:net*eur,revT,revP,revA,depCourante,mensuCredits,depT,cash,cashflow,pvLatente,
      tauxEpargne:revT?cashflow/revT:0, objEUR, pctObj:objEUR?net/objEUR:0, reste:Math.max(0,objEUR-net),
      ratioFI:depT?revP/depT:0, capitalFI:data.params.retraitFI?(depT*12)/data.params.retraitFI:0, fondsMois:depT?cash/depT:0 };
  },[data,mc]);

  useEffect(()=>{ const ym=nowYM(); setData(d=>{ if((d.snapshots||{})[ym]===c.net) return d;
    return {...d,snapshots:{...(d.snapshots||{}),[ym]:c.net}}; }); },[c.net]);

    return Object.keys(m).filter(k=>m[k]>0).map((k,i)=>({label:k,value:m[k],color:colorFor(k,i)})); },[data.patrimoine]);
  const histCashflow=useMemo(()=> Object.keys(data.mois).sort().map(ym=>{const mm=data.mois[ym];
    return {ym,cf:sum(mm.revenus,r=>r.montant)-sum(mm.depenses,x=>x.montant)};}),[data.mois]);

  const doExport=()=>{ const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});

    r.readAsText(f); };

  const tabs=[["dashboard","Tableau de bord","dashboard"],["patrimoine","Patrimoine","bank"],["cashflow","Cashflow","wallet"],
    ["projection","Projection","chart"],["suivi","Suivi","trending"],["objectifs","Objectifs","target"],["reglages","Réglages","settings"]];

  return (<div className="min-h-screen">
    <header className="max-w-6xl mx-auto px-4 pt-6 pb-2">
      <div className="flex items-start gap-3 flex-wrap">
        <div className="w-12 h-12 rounded-2xl bg-gradient-to-br from-brand-400 to-brand-700 text-white flex items-center justify-center shadow-lg shadow-brand-500/25"><Snowflake/></div>
        <div className="flex-1 min-w-[220px] flex items-center">
          <h1 className="font-heading text-2xl font-bold text-ink-900 leading-tight">Snowball <span className="text-brand-600">Finance</span></h1>
        </div>
        <div className="text-right"><div className="text-xs text-ink-400 uppercase tracking-wide">Patrimoine net</div>
          <div className="font-heading text-2xl font-bold text-brand-700">{fmtE(c.net)}</div></div>
      </div>
    </header>
    <nav className="max-w-6xl mx-auto px-4 sticky top-2 z-20">
      <div className="frost rounded-2xl p-1.5 flex gap-1 overflow-x-auto shadow-sm">
        {tabs.map(([id,label,icon])=>(<button key={id} onClick={()=>setTab(id)}
          className={"flex items-center gap-2 px-3.5 py-2 rounded-xl text-sm font-medium whitespace-nowrap transition cursor-pointer "+
            (tab===id?"bg-gradient-to-br from-brand-500 to-brand-700 text-white shadow":"text-ink-500 hover:text-ink-900 hover:bg-ink-100")}>
          <Icon name={icon} className="w-4 h-4"/>{label}</button>))}
      </div>
    </nav>
    <main className="max-w-6xl mx-auto px-4 py-6">
      {tab==="dashboard"&&<Dashboard c={c} alloc={alloc} data={data} setData={setData} hist={histCashflow} go={setTab}/>}
      {tab==="patrimoine"&&<Patrimoine data={data} setData={setData} c={c} alloc={alloc}/>}
      {tab==="cashflow"&&<Cashflow data={data} setData={setData} mc={mc} setMc={setMc} moisActif={moisActif} c={c}/>}
      {tab==="projection"&&<Projection data={data} setData={setData} c={c}/>}

/* insights */
function insights(c,data){
  const out=[]; const add=(tone,titre,txt)=>out.push({tone,titre,txt});
  if(c.pctObj>=0.9&&c.pctObj<1) add("good","Tu y es presque","Plus que "+fmtE(c.reste)+" pour atteindre ton objectif. Un trimestre de cashflow peut suffire.");
  if(c.pctObj>=1) add("good","Objectif atteint","Ton patrimoine net dépasse ton objectif. Fixe le prochain cap dans Réglages.");
  if(c.ratioFI>=1) add("good","Indépendance financière","Tes revenus passifs couvrent 100% de ton train de vie. Tu es libre financièrement.");
  else if(c.depT>0) add("info","Vers la liberté financière","Tes revenus passifs couvrent "+fmtP(c.ratioFI)+" de ton train de vie. Il te manque "+fmtE(c.depT-c.revP)+" par mois de passif pour être libre.");
  const exces=c.cash-data.params.cibleFondsMois*c.depT;
  if(c.depT>0&&c.fondsMois>data.params.cibleFondsMois+3) add("info","Du cash dort","Tu as "+fmtM(c.fondsMois)+" de réserve (cible "+data.params.cibleFondsMois+"). Environ "+fmtE(exces)+" pourraient être investis pour accélérer la boule de neige.");
  if(c.depT>0&&c.fondsMois<data.params.cibleFondsMois) add("warn","Réserve à renforcer","Ton fonds d'urgence ("+fmtM(c.fondsMois)+") est sous ta cible de "+data.params.cibleFondsMois+" mois.");
  const dCher=(data.dettes||[]).filter(d=>n(d.taux)>=0.07).sort((a,b)=>b.taux-a.taux)[0];
  if(dCher) add("warn","Dette coûteuse","« "+dCher.nom+" » coûte "+fmtP(dCher.taux)+" par an. La rembourser équivaut à un rendement garanti supérieur à la plupart des placements.");
  if(c.revT>0&&c.tauxEpargne>=0.5) add("good","Excellent taux d'épargne","Tu épargnes "+fmtP(c.tauxEpargne)+" de tes revenus, soit "+fmtE(c.cashflow*12)+" par an à réinvestir.");
  else if(c.revT>0&&c.tauxEpargne<0.2) add("warn","Taux d'épargne faible","Tu n'épargnes que "+fmtP(c.tauxEpargne)+". Vise au moins 20% en revoyant tes plus grosses dépenses.");
  if(c.pvLatente>0) add("info","Plus-value latente","Tu portes "+fmtE(c.pvLatente)+" de plus-value latente sur tes actifs. Elle se concrétisera à la revente.");
  if(!out.length) add("info","Commence à remplir","Renseigne ton patrimoine et ton cashflow pour obtenir des recommandations personnalisées.");
  return out;
}

/* Cashflow */
function Cashflow({data,setData,mc,setMc,moisActif,c}){
  const changeMois=ym=>setData(d=>{ if(!d.mois[ym]){ const keys=Object.keys(d.mois).sort(); const src=d.mois[keys[keys.length-1]]||{revenus:[],depenses:[]};
      const cl=a=>a.map(x=>({...x,id:uid()})); return {...d,moisActif:ym,mois:{...d.mois,[ym]:{revenus:cl(src.revenus),depenses:cl(src.depenses)}}}; }
    return {...d,moisActif:ym}; });
  const upd=(k,id,patch)=>setMc(k,mc[k].map(x=>x.id===id?{...x,...patch}:x));
  const del=(k,id)=>setMc(k,mc[k].filter(x=>x.id!==id));
  const updC=(id,p)=>setData(d=>({...d,dettes:d.dettes.map(x=>x.id===id?{...x,...p}:x)}));
  const delC=id=>setData(d=>({...d,dettes:d.dettes.filter(x=>x.id!==id)}));
  const addC=()=>setData(d=>({...d,dettes:[...d.dettes,{id:uid(),nom:"Nouveau crédit",montant:0,mensualite:0,taux:0.03,actifLie:""}]}));
  const mois=Object.keys(data.mois).sort();
  const groupes=(()=>{const m={}; GROUPES.forEach(g=>m[g.nom]={nom:g.nom,pct:g.pct,total:0}); m["Autres"]={nom:"Autres",pct:null,total:0};

function Total({label,v}){return <div className="flex justify-between mt-3 pt-3 border-t border-ink-200"><span className="font-heading font-semibold text-ink-700">{label}</span><span className="font-heading font-bold text-brand-700">{fmtE(v)}</span></div>;}

/* Projection */
function Projection({data,setData,c}){
  const pr=data.projection;
  const annee=pr.annee||(new Date().getFullYear()+1);
  const rdt=pr.rendement!=null?pr.rendement:0.08;
  const mensuel=(pr.mensuel&&pr.mensuel.length===12)?pr.mensuel:Array.from({length:12},()=>({rev:0,dep:0}));
  const setPr=p=>setData(d=>({...d,projection:{...pr,annee,rendement:rdt,mensuel,...p}}));
  const setM=(i,k,v)=>setPr({mensuel:mensuel.map((x,j)=>j===i?{...x,[k]:v}:x)});
  const prefill=()=>setPr({mensuel:mensuel.map(()=>({rev:Math.round(c.revT),dep:Math.round(c.depT)}))});
  const totRev=sum(mensuel,x=>x.rev), totDep=sum(mensuel,x=>x.dep), totCF=totRev-totDep;
  const start=c.net, plusValue=start*rdt, netFin=start+totCF+plusValue;
  const cum=[]; let acc=start; mensuel.forEach(x=>{acc+=n(x.rev)-n(x.dep); cum.push(acc);});
  const presets=[["Prudent",0.04],["Base",0.08],["Ambitieux",0.15]];
  const scen=[["Prudent",0.04,"#94a3b8"],["Base",0.08,"#0284c7"],["Ambitieux",0.15,"#38bdf8"]];
  const trajs=scen.map(([nom,r,col])=>({nom,col,...projeter(start,totCF,r,c.objEUR,15)}));
  const hitAnnee=trajs[1].hit?annee-1+trajs[1].hit:null;
  return (<div className="space-y-5">
    <Card title={"Plan mensuel "+annee} sub="Prévois revenus et dépenses mois par mois pour l'année prochaine. C'est un budget prévisionnel, indépendant du Cashflow réel.">
      <div className="flex flex-wrap items-center gap-3 mb-4">
        <div className="flex items-center gap-1">
          <button onClick={()=>setPr({annee:annee-1})} className="w-8 h-8 rounded-lg border border-ink-200 bg-white hover:bg-ink-100 cursor-pointer">‹</button>
          <span className="font-heading font-bold text-lg text-ink-900 w-16 text-center">{annee}</span>
          <button onClick={()=>setPr({annee:annee+1})} className="w-8 h-8 rounded-lg border border-ink-200 bg-white hover:bg-ink-100 cursor-pointer">›</button></div>
        <div className="flex items-center gap-2 text-sm"><span className="text-ink-600">Rendement attendu :</span><Pct value={rdt} onChange={v=>setPr({rendement:v})} className="w-20"/>
          <div className="flex gap-1.5">{presets.map(([l,v])=><button key={l} onClick={()=>setPr({rendement:v})} className={"text-xs px-2 py-1 rounded-lg border cursor-pointer transition "+(Math.abs(rdt-v)<0.001?"bg-brand-600 text-white border-brand-600":"border-ink-200 text-ink-600 hover:bg-ink-100")}>{l}</button>)}</div></div>
        <button onClick={prefill} className="text-sm text-brand-700 hover:underline cursor-pointer ml-auto">Préremplir depuis mon mois actuel</button>
      </div>
      <div className="overflow-x-auto"><table className="w-full text-sm">
        <thead><tr className="text-ink-400 text-left"><th className="py-2 font-medium">Mois</th><th className="font-medium">Revenus prévus</th><th className="font-medium">Dépenses prévues</th><th className="font-medium">Cashflow</th><th className="font-medium">Cumulé (net)</th></tr></thead>
        <tbody>{mensuel.map((m,i)=>{const cf=n(m.rev)-n(m.dep);return(<tr key={i} className="border-t border-ink-100">
          <td className="py-1.5 capitalize text-ink-700 font-medium w-28">{MOIS[i]}</td>
          <td className="w-40 pr-2"><Money value={m.rev} onChange={v=>setM(i,"rev",v)}/></td>
          <td className="w-40 pr-2"><Money value={m.dep} onChange={v=>setM(i,"dep",v)}/></td>
          <td className={"font-medium "+(cf>=0?"text-brand-700":"text-red-500")}>{fmtE(cf)}</td>
          <td className="font-heading font-semibold text-ink-900">{fmtEk(cum[i])}</td></tr>);})}</tbody>
        <tfoot><tr className="border-t-2 border-ink-200 font-heading font-bold"><td className="py-2">Total {annee}</td>
          <td className="text-brand-700">{fmtE(totRev)}</td><td className="text-red-500">{fmtE(totDep)}</td><td className="text-sky-600">{fmtE(totCF)}</td><td/></tr></tfoot>
      </table></div>
    </Card>
    <div className="grid sm:grid-cols-4 gap-3">
      <div className="card rounded-3xl p-4 text-white" style={{background:"linear-gradient(135deg,#38bdf8,#0369a1)"}}>
        <div className="text-brand-50 text-xs">Patrimoine net fin {annee}</div><div className="font-heading text-2xl font-bold">{fmtE(netFin)}</div>
        <div className="text-brand-100 text-xs mt-0.5">+{fmtE(netFin-start)} sur l'année</div></div>
      <Mini label={"Apports cumulés "+annee} v={fmtE(totCF)}/>
      <Mini label={"Plus-value estimée ("+fmtP(rdt)+")"} v={fmtE(plusValue)}/>
      <Mini label="Objectif atteint" v={fmtP(netFin/c.objEUR)}/>
    </div>
    <Card title="Trajectoire du patrimoine net sur l'année" sub="Évolution mois par mois selon ton plan ci-dessus">
      <LineChart labels={["déb.",...MOIS.map(m=>m.slice(0,3))]} series={[{name:"Net",color:BLUE,points:[start,...cum],fill:true}]} height={220}/>
    </Card>
    <Card title="Trajectoire vers l'objectif" sub={hitAnnee?("Au rythme « Base », objectif atteint en "+hitAnnee):"Augmente l'apport ou le rendement pour atteindre l'objectif sous 15 ans"}>
      <LineChart labels={[String(annee-1),...trajs[1].points.map(p=>String(annee-1+p.i))]}
        series={[...trajs.map(t=>({name:t.nom,color:t.col,points:[start,...t.points.map(p=>p.net)]})),
          {name:"Objectif",color:"#cbd5e1",points:[c.objEUR,...trajs[1].points.map(()=>c.objEUR)],dash:true}]} height={250}/>
      <div className="flex flex-wrap gap-4 mt-3 text-sm">
        {trajs.map((t,i)=>(<div key={i} className="flex items-center gap-2"><span className="w-3 h-3 rounded-full" style={{background:t.col}}/>
          <span className="text-ink-600">{t.nom} ({fmtP(scen[i][1])}) : objectif {t.hit?("en "+(annee-1+t.hit)):"au-delà de 15 ans"}</span></div>))}
      </div>
    </Card>
  </div>);
}

/* Suivi */
function Suivi({data,setData,c,hist}){
  const upd=(id,p)=>setData(d=>({...d,suivi:d.suivi.map(r=>r.id===id?{...r,...p}:r)}));
  const del=id=>setData(d=>({...d,suivi:d.suivi.filter(r=>r.id!==id)}));
  const add=()=>setData(d=>{const last=[...d.suivi].sort((a,b)=>a.annee-b.annee).slice(-1)[0];
    return {...d,suivi:[...d.suivi,{id:uid(),annee:(last?last.annee+1:new Date().getFullYear()),brut:0,dettes:0}]};});
  const rows=[...data.suivi].sort((a,b)=>a.annee-b.annee);
  const nets=rows.map(r=>n(r.brut)-n(r.dettes));
  const snaps=Object.keys(data.snapshots||{}).sort();
  const realNets=snaps.map(k=>data.snapshots[k]);
  const pr=data.projection||{}; const plan=(pr.mensuel&&pr.mensuel.length===12)?pr.mensuel:[];
  let acc=c.net; const projLabels=[],projNets=[];
  plan.forEach((m,i)=>{acc+=n(m.rev)-n(m.dep); projLabels.push(MOIS[i].slice(0,3)+". "+String(pr.annee||"").slice(2)); projNets.push(acc);});
  const npLabels=[...snaps.map(moisCourt),...projLabels]; const lastReal=realNets.length-1;
  return (<div className="space-y-5">
    <Card title="Patrimoine net" sub="Tes données réelles mois par mois (trait plein), prolongées par ton plan de l'année prochaine (pointillés)">
      {snaps.length>0? <LineChart labels={npLabels}
        series={[{name:"Réel",color:BLUE,points:[...realNets,...projNets.map(()=>null)],fill:true},
          {name:"Projeté",color:"#7dd3fc",points:[...realNets.map((v,i)=>i===lastReal?v:null),...projNets],dash:true},
          {name:"Objectif",color:"#cbd5e1",points:npLabels.map(()=>c.objEUR),dash:true}]} height={240}/>
        : <div className="text-sm text-ink-400">Le suivi se construit automatiquement au fil des mois.</div>}
    </Card>
    <Card title="Cashflow mensuel" sub="Alimenté automatiquement par tes saisies de l'onglet Cashflow">
      {hist.length? <LineChart labels={hist.map(h=>moisCourt(h.ym))} series={[{name:"Cashflow",color:"#0ea5e9",points:hist.map(h=>h.cf),fill:true}]} height={190}/>
        : <div className="text-sm text-ink-400">Saisis des mois dans Cashflow pour voir la courbe.</div>}
      {hist.length>0&&<div className="grid grid-cols-3 gap-3 mt-3">
        <Mini label="Cashflow cumulé" v={fmtE(hist.reduce((s,h)=>s+h.cf,0))}/>
        <Mini label="Moyenne par mois" v={fmtE(hist.reduce((s,h)=>s+h.cf,0)/hist.length)}/>
        <Mini label="Meilleur mois" v={fmtE(Math.max(...hist.map(h=>h.cf)))}/></div>}
    </Card>
    <Card title="Historique annuel" sub="Complète les années passées (avant l'utilisation de l'app)" right={<AddBtn onClick={add}>Année</AddBtn>}>
      {rows.length>1&&<div className="mb-4"><LineChart labels={rows.map(r=>r.annee)} series={[{name:"Net",color:"#0369a1",points:nets,fill:true}]} height={190}/></div>}
      <div className="overflow-x-auto"><table className="w-full text-sm">
        <thead><tr className="text-ink-400 text-left"><th className="py-2 font-medium">Année</th><th className="font-medium">Patrim. brut</th><th className="font-medium">Dettes</th><th className="font-medium">Patrim. net</th><th className="font-medium">Progr.</th><th/></tr></thead>
        <tbody>{rows.map((r,i)=>{const net=n(r.brut)-n(r.dettes);const prev=i>0?nets[i-1]:null;const prog=prev?((net-prev)/prev):null;
          return(<tr key={r.id} className="border-t border-ink-100">
            <td className="py-1.5 w-24"><input type="number" value={r.annee} onChange={e=>upd(r.id,{annee:parseInt(e.target.value||0)})} className="num w-20 px-2 py-1.5 rounded-lg border border-ink-200 bg-white outline-none focus:border-brand-400"/></td>
            <td className="w-40 pr-2"><Money value={r.brut} onChange={v=>upd(r.id,{brut:v})}/></td>

            <td className={prog===null?"text-ink-400":(prog>=0?"text-brand-600":"text-red-500")}>{prog===null?"":(prog>=0?"+":"")+fmtP(prog)}</td>
            <td><IconBtn name="x" onClick={()=>del(r.id)} title="Supprimer"/></td></tr>);})}</tbody></table></div>
    </Card>
  </div>);

/* Objectifs */
const STATUTS=["À faire","En cours","Fait"];
const stBadge={"Fait":"bg-brand-100 text-brand-800","En cours":"bg-amber-100 text-amber-700","À faire":"bg-ink-100 text-ink-500"};
function suggestionsObj(c,data){
  const out=[]; const norm=s=>(s||"").toLowerCase().replace(/\s/g,"");
  const has=t=>data.jalons.some(j=>norm(j.intitule).includes(norm(t)));
  if(c.depT>0 && c.fondsMois<data.params.cibleFondsMois && !has("fonds d'urgence")) out.push({texte:"Constituer "+data.params.cibleFondsMois+" mois de fonds d'urgence",categorie:"Sécurité"});
  if(c.revT>0 && c.tauxEpargne<0.2 && !has("taux d'épargne")) out.push({texte:"Atteindre 20% de taux d'épargne",categorie:"Sécurité"});
  if(c.depT>0 && c.ratioFI<1 && !has("100% du train de vie")) out.push({texte:"Couvrir 100% du train de vie en revenus passifs",categorie:"Revenus passifs"});
  const dCher=(data.dettes||[]).filter(d=>n(d.taux)>=0.07).sort((a,b)=>b.taux-a.taux)[0];
  if(dCher && !has("rembourser")) out.push({texte:"Rembourser « "+dCher.nom+" »",categorie:"Sécurité"});
  const paliers=[100000,250000,500000,1000000,2000000,5000000]; const next=paliers.find(p=>p>c.net);
  if(next && !has("net supérieur à "+next.toLocaleString("fr-FR"))) out.push({texte:"Patrimoine net supérieur à "+next.toLocaleString("fr-FR")+" €",categorie:"Patrimoine"});
  const pRP=[1000,2500,5000,10000]; const nRP=pRP.find(p=>p>c.revP);
  if(nRP && c.revP>0 && !has("passifs supérieurs à "+nRP.toLocaleString("fr-FR"))) out.push({texte:"Revenus passifs supérieurs à "+nRP.toLocaleString("fr-FR")+" € par mois",categorie:"Revenus passifs"});
  return out.slice(0,5);
}

  const add=(texte,categorie)=>setData(d=>({...d,jalons:[...d.jalons,{id:uid(),intitule:texte||"Nouvel objectif",categorie:categorie||"",statut:"À faire"}]}));
  const cnt=s=>data.jalons.filter(j=>j.statut===s).length, tot=data.jalons.length||1;
  const sugg=suggestionsObj(c,data);
  return (<div className="space-y-5">

      <div className="h-2.5 rounded-full bg-ink-100 overflow-hidden"><div className="h-full bg-gradient-to-r from-brand-400 to-brand-600 rounded-full transition-all" style={{width:(cnt("Fait")/tot*100)+"%"}}/></div></Card>
    {sugg.length>0&&<Card title="Suggestions" sub="Proposées automatiquement à partir de tes chiffres. Bientôt enrichies par l'IA de pilotage.">
      <div className="space-y-2">{sugg.map((s,i)=>(<div key={i} className="flex items-center gap-3 rounded-2xl border border-sky-200 bg-sky-50 p-3">
        <span className="w-2 h-2 rounded-full bg-sky-500 shrink-0"/>
        <div className="flex-1 text-sm text-ink-700">{s.texte}</div>
        <button onClick={()=>add(s.texte,s.categorie)} className="inline-flex items-center gap-1 text-sm font-medium text-brand-700 hover:text-brand-800 hover:underline cursor-pointer shrink-0"><Icon name="plus" className="w-4 h-4"/>Ajouter</button></div>))}</div>
    </Card>}
    <Card title="Mes objectifs" right={<AddBtn onClick={()=>add()}>Ajouter</AddBtn>}>
      {data.jalons.length===0&&<div className="text-sm text-ink-400 py-4 text-center">Aucun objectif. Ajoute le tien ou pioche dans les suggestions.</div>}
      <div className="space-y-2">{data.jalons.map(j=>(<div key={j.id} className="flex items-center gap-2">
        <div className="flex-1"><TextInput value={j.intitule} onChange={v=>upd(j.id,{intitule:v})}/></div>
        <select value={j.statut} onChange={e=>upd(j.id,{statut:e.target.value})} className={"text-sm rounded-lg border-0 py-2 px-3 font-medium cursor-pointer "+stBadge[j.statut]}>{STATUTS.map(s=><option key={s} value={s}>{s}</option>)}</select>
        <IconBtn name="x" onClick={()=>del(j.id)} title="Supprimer"/></div>))}</div></Card>
  </div>);
}

/* Réglages */
function Reglages({data,setData,setParam,doExport,fileRef,doImport,fetchFX,flash}){
  const p=data.params;
  const [gh,setGh]=useState(loadGh);
  const [busy,setBusy]=useState("");
  useEffect(()=>{try{localStorage.setItem(GH_KEY,JSON.stringify(gh));}catch(e){}},[gh]);
  const setG=(k,v)=>setGh(s=>({...s,[k]:v}));
  const ok=gh.token&&gh.owner&&gh.repo&&gh.path;
  const sauver=async()=>{ if(!ok){flash("Renseigne le compte, le repo et le jeton");return;} setBusy("save");
    try{ const cur=await ghGet(gh); await ghPut(gh,JSON.stringify(data,null,2),cur.sha); setGh(s=>({...s,maj:new Date().toISOString().slice(0,16).replace("T"," ")})); flash("Sauvegardé sur GitHub"); }
    catch(e){ flash("Échec sauvegarde : "+e.message); } setBusy(""); };
  const restaurer=async()=>{ if(!ok){flash("Renseigne le compte, le repo et le jeton");return;} setBusy("load");
    try{ const cur=await ghGet(gh); if(cur&&cur.content){ const d=JSON.parse(cur.content); if(d&&d.params){setData(d);flash("Données restaurées depuis GitHub");} else flash("Sauvegarde invalide"); } else flash("Aucune sauvegarde trouvée"); }
    catch(e){ flash("Échec restauration : "+e.message); } setBusy(""); };
  return (<div className="space-y-5">
    <Card title="Objectif et paramètres" sub="Tout est en euros par priorité. Le taux de change se récupère automatiquement.">
      <div className="grid md:grid-cols-2 gap-4">
        <Field label="Objectif de patrimoine net (en €)"><Money value={p.objectifEUR} onChange={v=>setParam("objectifEUR",v)}/></Field>
        <Field label="Cible fonds d'urgence (mois)"><Money value={p.cibleFondsMois} onChange={v=>setParam("cibleFondsMois",v)} suffix="m"/></Field>
        <Field label="Taux EUR vers USD (automatique)">
          <div className="flex items-center gap-2">
            <div className="flex-1 px-3 py-2 rounded-xl border border-ink-200 bg-ink-100/60 text-ink-700">1 € = {(p.eurusd||0).toFixed(4)} $</div>
            <button onClick={fetchFX} className="p-2.5 rounded-xl border border-ink-200 bg-white hover:bg-ink-100 text-ink-500 cursor-pointer" title="Actualiser"><Icon name="refresh" className="w-4 h-4"/></button></div>
          <p className="text-xs text-ink-400 mt-1">Récupéré automatiquement{p.fxMaj?", maj "+p.fxMaj:""}. Le dollar n'est affiché qu'en information secondaire.</p></Field>
      </div>
    </Card>
    <Card title="Sauvegarde sur GitHub" sub="Tes données sont enregistrées dans ton repo privé GitHub. Récupérables depuis n'importe quel appareil, jamais perdues si ton ordi lâche.">
      <div className="grid md:grid-cols-2 gap-4">
        <Field label="Compte GitHub"><TextInput value={gh.owner||""} onChange={v=>setG("owner",v)} placeholder="ton-pseudo-github"/></Field>
        <Field label="Repo privé (pour les données)"><TextInput value={gh.repo||""} onChange={v=>setG("repo",v)} placeholder="snowball-data"/></Field>
        <Field label="Fichier"><TextInput value={gh.path||""} onChange={v=>setG("path",v)} placeholder="snowball-data.json"/></Field>
        <Field label="Jeton d'accès (fine-grained, privé)"><input type="password" value={gh.token||""} onChange={e=>setG("token",e.target.value)} placeholder="github_pat_…" className="w-full px-3 py-2 rounded-xl border border-ink-200 bg-white outline-none focus:border-brand-400 focus:ring-2 focus:ring-brand-100"/></Field>
      </div>
      <div className="flex flex-wrap items-center gap-3 mt-4">
        <button onClick={sauver} disabled={busy} className="inline-flex items-center gap-2 bg-brand-600 hover:bg-brand-700 disabled:opacity-50 text-white px-4 py-2.5 rounded-xl text-sm font-medium transition cursor-pointer"><Icon name="up" className="w-4 h-4"/>{busy==="save"?"Sauvegarde…":"Sauvegarder sur GitHub"}</button>
        <button onClick={restaurer} disabled={busy} className="inline-flex items-center gap-2 bg-white border border-brand-300 text-brand-700 hover:bg-brand-50 disabled:opacity-50 px-4 py-2.5 rounded-xl text-sm font-medium transition cursor-pointer"><Icon name="down" className="w-4 h-4"/>{busy==="load"?"Restauration…":"Restaurer depuis GitHub"}</button>
        {gh.maj&&<span className="text-xs text-ink-400">Dernière sauvegarde : {gh.maj}</span>}
      </div>
      <p className="text-xs text-ink-400 mt-3">Le jeton reste sur cet appareil (jamais partagé). Crée un jeton « fine-grained » limité à ce repo, permission Contents en lecture/écriture. Sur un nouvel appareil : renseigne les mêmes champs puis « Restaurer ».</p>
    </Card>
    <Card title="Sauvegarde locale (fichier)" sub="En complément : un export manuel à garder chez toi.">
      <div className="flex flex-wrap gap-3">
        <button onClick={doExport} className="inline-flex items-center gap-2 bg-white border border-ink-200 text-ink-700 hover:bg-ink-100 px-4 py-2.5 rounded-xl text-sm font-medium transition cursor-pointer"><Icon name="down" className="w-4 h-4"/>Exporter (JSON)</button>
        <button onClick={()=>fileRef.current.click()} className="inline-flex items-center gap-2 bg-white border border-ink-200 text-ink-700 hover:bg-ink-100 px-4 py-2.5 rounded-xl text-sm font-medium transition cursor-pointer"><Icon name="up" className="w-4 h-4"/>Importer (JSON)</button>
        <input ref={fileRef} type="file" accept="application/json" className="hidden" onChange={doImport}/>
      </div></Card>
  </div>);
}
function Field({label,children}){return <div><div className="text-sm text-ink-600 mb-1">{label}</div>{children}</div>;}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
